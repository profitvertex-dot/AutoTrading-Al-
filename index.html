<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
body{background:#0e0e0e;color:#fff;font-family:sans-serif;margin:0;padding:10px}
.card{background:#1a1a1a;border-radius:16px;padding:14px;margin:10px 0;border:1px solid #222}
.btn{flex:1;padding:14px;border-radius:12px;border:none;font-weight:bold}
.real{background:#8b5cf6;color:#fff} .demo{background:#222;color:#888}
.bal{font-size:36px;font-weight:900}
#tvchart{height:300px}
</style>
</head>
<body>

<div style="display:flex;gap:8px">
<button class="btn demo" onclick="location.reload()">✏️ DEMO ₹10K</button>
<button class="btn real">💰 REAL CoinDCX</button>
</div>

<div class="card" style="display:flex;justify-content:space-between;align-items:center">
<div>
<div style="color:#888;font-size:12px">TOTAL BALANCE</div>
<div class="bal">₹<span id="inr">527.00</span></div>
<div style="color:#666;font-size:12px" id="paxg">real • 0.00115 PAXG • loading...</div>
</div>
<button onclick="getBal()" style="background:#8b5cf6;border:0;color:#fff;padding:10px 14px;border-radius:10px">Refresh 🔄</button>
</div>

<div class="card">
<div style="color:#888;font-size:12px;margin-bottom:6px">PAXG/INR • 1m • <span style="color:#00ff88">GREEN=BUY</span> / <span style="color:#ff3b3b">RED=SELL</span></div>
<div id="tvchart"></div>
<div id="sig" style="font-weight:bold;margin-top:8px">Signal: WAIT</div>
</div>

<script>
let chart = LightweightCharts.createChart(document.getElementById('tvchart'), {
  layout:{background:{color:'#1a1a1a'},textColor:'#aaa'},
  grid:{vertLines:{color:'#222'},horzLines:{color:'#222'}},
  width: document.getElementById('tvchart').clientWidth, height:300
});
let candle = chart.addCandlestickSeries({upColor:'#00ff88',downColor:'#ff4444',wickUpColor:'#00ff88',wickDownColor:'#ff4444',borderVisible:false});

async function getBal(){
  try{
    let r = await fetch('/api/balance',{method:'POST'});
    let d = await r.json();
    if(Array.isArray(d)){
      let INR = d.find(x=>x.currency==='INR');
      let PAXG = d.find(x=>x.currency==='PAXG');
      if(INR) document.getElementById('inr').innerText = Number(INR.balance).toFixed(2);
      if(PAXG) document.getElementById('paxg').innerText = 'real • '+Number(PAXG.balance).toFixed(6)+' PAXG';
    }
  }catch(e){}
}
async function getCandle(){
  let r = await fetch('/api/candles'); let data = await r.json();
  data = data.filter(c=>c.close>100000).slice(-50);
  let final = data.map(c=>({time:Math.floor(c.time/1000), open:c.open, high:c.high, low:c.low, close:c.close}));
  candle.setData(final);
  if(final.length){
    let last = final[final.length-1];
    let s = last.close > last.open ? 'BUY' : 'SELL';
    let el = document.getElementById('sig');
    el.innerText = 'Signal: '+s+' @ ₹'+last.close.toFixed(2);
    el.style.color = s==='BUY' ? '#00ff88' : '#ff4444';
  }
}
getBal(); getCandle();
setInterval(getCandle,10000);
setInterval(getBal,15000);
</script>
</body>
</html>
