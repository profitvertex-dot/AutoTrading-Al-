<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>AutoTrading AI - Live</title>
<link rel="icon" href="logo.png">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
<style>body{background:#07070B;color:#fff;font-family:Inter,sans-serif}.card{background:#15151D;border:1px solid #232330}</style>
</head>
<body class="p-3 pb-20">
<div class="max-w-md mx-auto">

<!-- HEADER WITH YOUR LOGO -->
<div class="flex items-center justify-between mb-5">
<div class="flex items-center gap-3">
<img src="logo.png" class="w-11 h-11 rounded-xl shadow-[0_0_20px_rgba(139,92,246,0.6)] bg-black">
<div>
<h1 class="text-[19px] font-black leading-none">AutoTrading <span class="text-violet-400">AI</span></h1>
<p class="text-[9px] text-zinc-500 tracking-[2.5px] font-bold mt-1">COINDCX • LIVE • REAL PRICE</p>
</div>
</div>
<div id="botStatus" class="px-3 py-1.5 rounded-full text-[11px] font-black bg-red-500/15 text-red-400 border border-red-500/20">STOP</div>
</div>

<!-- BALANCE -->
<div class="card rounded-[22px] p-4">
<p class="text-[10px] text-zinc-500 font-bold tracking-widest">TOTAL BALANCE</p>
<h2 class="text-4xl font-black mt-1">₹<span id="totalBal">201.38</span></h2>
<p class="text-[11px] text-zinc-500 mt-1">Paper Trading • Real BTC Price</p>
<div class="grid grid-cols-3 gap-2 mt-4">
<div class="bg-[#1E1E2A] rounded-xl p-2.5"><p class="text-[9px] text-zinc-500">P/L TODAY</p><p class="text-sm font-bold text-green-400">+₹0.00</p></div>
<div class="bg-[#1E1E2A] rounded-xl p-2.5"><p class="text-[9px] text-zinc-500">TRADES</p><p class="text-sm font-bold">0</p></div>
<div class="bg-[#1E1E2A] rounded-xl p-2.5"><p class="text-[9px] text-zinc-500">WIN RATE</p><p class="text-sm font-bold">--%</p></div>
</div>
</div>

<!-- LIVE CHART - FINAL FIX -->
<div class="card rounded-[22px] p-3 mt-4">
<div class="flex justify-between items-center mb-2 px-1">
<p class="text-[13px] font-bold flex items-center gap-2"><span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>BTC/INR Live Chart</p>
<p id="livePrice" class="text-[12px] font-black text-violet-400 bg-violet-500/10 px-2.5 py-1 rounded-full">Loading...</p>
</div>
<div id="candleChart" style="height:380px;width:100%"></div>
<p class="text-[9px] text-zinc-600 text-center mt-2">CoinDCX Real • AutoTrading AI Engine</p>
</div>

<!-- SIGNAL -->
<div class="card rounded-[22px] p-4 mt-4 flex justify-between items-center">
<div><p class="text-[10px] text-zinc-500 font-bold tracking-widest">AI SIGNAL</p><p id="signalText" class="text-3xl font-black mt-1">HOLD</p><p class="text-[11px] text-zinc-500">RSI: <span id="rsiVal" class="text-white font-bold">--</span></p></div>
<div id="signalIcon" class="w-14 h-14 rounded-full bg-zinc-800 flex items-center justify-center text-xl">⚪</div>
</div>

<button id="toggleBtn" class="w-full mt-4 py-4 rounded-2xl font-black bg-violet-600 shadow-[0_0_30px_rgba(124,58,237,0.4)]">START BOT 🚀</button>
<div id="logs" class="card rounded-2xl p-3 mt-4 h-28 overflow-auto text-[10px] font-mono text-zinc-400">🤖 Connecting...</div>
</div>

<script>
let hist=[], lineData=[], chart, lineSeries, isRunning=false;
const el=document.getElementById('candleChart');
chart=LightweightCharts.createChart(el,{layout:{background:{color:'#15151D'},textColor:'#888'},grid:{vertLines:{color:'#1E1E2A'},horzLines:{color:'#1E1E2A'}},width:el.clientWidth,height:380,timeScale:{timeVisible:true,secondsVisible:true,borderColor:'#232330'},rightPriceScale:{borderColor:'#232330',scaleMargins:{top:0.2,bottom:0.2}}});
lineSeries=chart.addLineSeries({color:'#8b5cf6',lineWidth:2,priceLineColor:'#8b5cf6',lastValueVisible:true,priceLineVisible:true});
function log(m){let l=document.getElementById('logs');l.innerHTML+=`<br>[${new Date().toLocaleTimeString()}] ${m}`;l.scrollTop=l.scrollHeight;}

async function loadReal(){
 try{
   let r=await fetch('/api/candles'); let d=await r.json();
   if(d && d.length){
     lineData=[]; hist=[];
     d.forEach(c=>{let t=Math.floor(c.time/1000); let price=parseFloat(c.close); lineData.push({time:t,value:price}); hist.push(price);});
     lineSeries.setData(lineData); chart.timeScale().fitContent();
     log('✅ Chart loaded: '+d.length+' candles');
   }
 }catch(e){log('❌ Chart load fail');}
}
async function tick(){
 try{
   let tr=await (await fetch('/api/ticker')).json();
   let p=0; if(Array.isArray(tr)){let b=tr.find(x=>x.market==='BTCINR'); p=b?parseFloat(b.last_price):0;} else p=parseFloat(tr.last_price||0);
   if(!p) return;
   document.getElementById('livePrice').innerText='₹'+Math.round(p).toLocaleString('en-IN');
   let t=Math.floor(Date.now()/1000);
   lineData.push({time:t,value:p}); if(lineData.length>200) lineData.shift();
   lineSeries.setData(lineData);
   hist.push(p); if(hist.length>50) hist.shift();
   let rsi=50; if(hist.length>14){let g=0,l=0;for(let i=1;i<hist.length;i++){let d=hist[i]-hist[i-1];if(d>0)g+=d;else l-=d;}let rs=g/(l||0.01);rsi=100-(100/(1+rs));}
   let sig=rsi<38?'BUY':rsi>68?'SELL':'HOLD';
   document.getElementById('signalText').innerText=sig; document.getElementById('rsiVal').innerText=rsi.toFixed(1);
   let ic=document.getElementById('signalIcon');
   if(sig==='BUY'){ic.innerText='📈';ic.className='w-14 h-14 rounded-full bg-green-500/20 flex items-center justify-center text-xl border border-green-500/30';}
   else if(sig==='SELL'){ic.innerText='📉';ic.className='w-14 h-14 rounded-full bg-red-500/20 flex items-center justify-center text-xl border border-red-500/30';}
   else{ic.innerText='⚪';ic.className='w-14 h-14 rounded-full bg-zinc-800 flex items-center justify-center text-xl';}
 }catch(e){}
}
(async()=>{await loadReal(); setInterval(tick,2000); tick(); setInterval(loadReal,60000);})();
document.getElementById('toggleBtn').onclick=()=>{let s=document.getElementById('botStatus'),b=document.getElementById('toggleBtn');isRunning=!isRunning;if(isRunning){s.innerText='RUNNING';s.className='px-3 py-1.5 rounded-full text-[11px] font-black bg-green-500/15 text-green-400 border border-green-500/20';b.innerText='STOP BOT ⏹️';b.className='w-full mt-4 py-4 rounded-2xl font-black bg-red-500';log('🚀 Bot STARTED');}else{s.innerText='STOP';s.className='px-3 py-1.5 rounded-full text-[11px] font-black bg-red-500/15 text-red-400 border border-red-500/20';b.innerText='START BOT 🚀';b.className='w-full mt-4 py-4 rounded-2xl font-black bg-violet-600';log('⏹️ Stopped');}};
window.addEventListener('resize',()=>chart.applyOptions({width:el.clientWidth}));
</script>
</body>
</html>
