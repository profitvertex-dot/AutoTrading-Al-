<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body{background:#000;color:#fff;font-family:Arial;padding:12px;margin:0}
.card{background:#151515;padding:15px;border-radius:12px;margin-bottom:12px;border:1px solid #222}
button{padding:12px 18px;border-radius:8px;border:none;font-weight:bold;margin:4px;cursor:pointer}
.buy{background:#00ff88;color:#000}
.sell{background:#ff3b3b;color:#fff}
.live{background:#00ff88;color:#000}
.demo{background:orange;color:#000}
#logs{font-size:11px;max-height:180px;overflow:auto;background:#000}
</style>
</head>
<body>

<div class="card">
<h3>PAXG GOLD BOT</h3>
Balance: ₹<span id="bal">527</span> | Market: PAXGINR<br><br>
<button id="modeBtn" class="demo" onclick="toggleMode()">MODE: DEMO</button>
<button id="autoBtn" onclick="toggleAuto()">AUTO: OFF</button>
</div>

<div class="card">
<canvas id="chart" height="200"></canvas>
<div id="signal" style="font-size:18px;margin-top:10px;font-weight:bold">Signal: WAIT...</div>
<div id="price" style="color:#888">Price: Loading...</div>
</div>

<div class="card">
<button class="buy" onclick="doTrade('buy')">BUY GOLD ₹500</button>
<button class="sell" onclick="doTrade('sell')">SELL GOLD</button>
</div>

<div class="card" id="logs">Logs yaha ayenge...<br></div>

<script>
let MODE = 'DEMO';
let AUTO = false;
let myChart = null;

function toggleMode(){
  MODE = MODE==='DEMO' ? 'LIVE' : 'DEMO';
  let btn = document.getElementById('modeBtn');
  btn.innerText = 'MODE: '+MODE;
  btn.className = MODE==='LIVE' ? 'live' : 'demo';
  addLog('Mode changed to '+MODE);
}

function toggleAuto(){
  AUTO = !AUTO;
  document.getElementById('autoBtn').innerText = 'AUTO: '+(AUTO?'ON':'OFF');
  addLog('Auto '+ (AUTO?'ON':'OFF'));
}

function addLog(t){
  let l = document.getElementById('logs');
  l.innerHTML = new Date().toLocaleTimeString() + ' - ' + t + '<br>' + l.innerHTML;
}

async function loadCandles(){
  try{
    let res = await fetch('/api/candles');
    let data = await res.json();
    if(!data || !data.length) return;
    let closes = data.map(c=>c.close);
    let labels = data.map((_,i)=>i);
    let last = closes[closes.length-1];
    document.getElementById('price').innerText = 'Price: ₹'+last;

    let signal = 'WAIT';
    if(closes[closes.length-1] > closes[closes.length-5]) signal='BUY';
    else signal='SELL';
    document.getElementById('signal').innerText = 'Signal: '+signal;
    document.getElementById('signal').style.color = signal==='BUY' ? '#00ff88' : '#ff3b3b';

    if(AUTO && MODE==='LIVE' && signal!=='WAIT'){
      doTrade(signal.toLowerCase());
    }

    if(myChart) myChart.destroy();
    myChart = new Chart(document.getElementById('chart'), {
      type: 'line',
      data: {
        labels: labels,
        datasets: [{ label: 'PAXG', data: closes, borderColor: '#00ff88', tension: 0.3, pointRadius: 0 }]
      },
      options: { plugins:{legend:{display:false}}, scales:{x:{display:false}, y:{display:true}} }
    });

  }catch(e){ addLog('Candle Error: '+e.message); }
}

async function doTrade(side){
  addLog(MODE+' '+side.toUpperCase()+' clicked');
  if(MODE==='DEMO'){
    addLog('DEMO Trade Done (no real money)');
    return;
  }
  try{
    let r = await fetch('/api/order',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({side: side})
    });
    let d = await r.json();
    addLog('CoinDCX Reply: '+JSON.stringify(d).substring(0,300));
  }catch(e){ addLog('Order Error: '+e.message); }
}

setInterval(loadCandles, 7000);
loadCandles();
</script>
</body>
</html>
