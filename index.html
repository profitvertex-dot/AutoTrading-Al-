<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AutoTrading AI - GOLD</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>body{font-family:'Space Grotesk',sans-serif;background:#0A0A0F}</style>
</head>
<body class="text-white">
<div class="max-w-[480px] mx-auto min-h-screen bg-[#0A0A0F] pb-28">

  <!-- HEADER -->
  <div class="flex items-center justify-between px-5 pt-6 pb-4">
    <div class="flex items-center gap-3">
      <img src="/logo.png" class="w-11 h-11 rounded-xl bg-[#1E1E2A] border border-amber-500/20 object-cover" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" />
      <div class="w-11 h-11 bg-gradient-to-br from-amber-400 to-yellow-600 rounded-xl hidden items-center justify-center font-black text-black">Au</div>
      <div>
        <h1 class="font-black text-[17px] leading-none">AutoTrading AI</h1>
        <p class="text-[11px] text-amber-400/70 font-bold tracking-widest mt-1">● REAL GOLD LIVE</p>
      </div>
    </div>
    <div class="w-9 h-9 rounded-full bg-[#1A1A23] border border-[#232330] flex items-center justify-center">☰</div>
  </div>

  <!-- BALANCE -->
  <div class="mx-5 rounded-[24px] bg-gradient-to-br from-[#1A1A23] to-[#14141C] border border-[#232330] p-5 relative overflow-hidden">
    <div class="absolute -top-10 -right-10 w-32 h-32 bg-amber-500/10 blur-[30px] rounded-full"></div>
    <p class="text-[11px] tracking-[2px] text-zinc-500 font-bold">TOTAL BALANCE • GOLD</p>
    <h2 class="text-[38px] font-black mt-1 tracking-tight">₹<span id="bal">477.14</span></h2>
    <div class="flex gap-2 mt-3">
      <span class="px-3 py-1.5 rounded-full bg-amber-500/10 border border-amber-500/20 text-[11px] font-bold text-amber-400">PAXG • GOLD</span>
      <span class="px-3 py-1.5 rounded-full bg-zinc-800 text-[11px] font-bold text-zinc-400">Min ₹100</span>
    </div>
  </div>

  <!-- CHART HEADER -->
  <div class="flex items-center justify-between px-5 mt-7 mb-3">
    <h3 class="font-bold text-[15px]">PAXG/INR (GOLD)</h3>
    <div class="flex gap-2">
      <button class="tf px-3 py-1.5 rounded-full bg-[#1E1E2A] text-[11px] font-bold border border-amber-500/30 text-amber-400" data-tf="15m">15m</button>
      <button class="tf px-3 py-1.5 rounded-full bg-[#1A1A23] text-[11px] font-bold text-zinc-500" data-tf="1h">1h</button>
      <button class="tf px-3 py-1.5 rounded-full bg-[#1A1A23] text-[11px] font-bold text-zinc-500" data-tf="1d">1D</button>
    </div>
  </div>

  <!-- CHART -->
  <div class="mx-5 rounded-[20px] bg-[#12121A] border border-[#1E1E2A] overflow-hidden">
    <div id="chart" class="w-full h-[320px]"></div>
  </div>

  <!-- ACTION BUTTONS - NEW PREMIUM DESIGN -->
  <div class="px-5 mt-6 grid grid-cols-3 gap-3">
    <button id="buyBtn" class="h-[56px] rounded-[16px] bg-gradient-to-b from-[#22C55E] to-[#16A34A] font-black text-[14px] tracking-wide shadow-[0_10px_20px_-10px_rgba(34,197,94,0.5)] active:scale-[0.98] transition-all flex items-center justify-center gap-2">
      <span>↗</span> BUY
    </button>
    <button id="sellBtn" class="h-[56px] rounded-[16px] bg-[#1A1A23] border border-[#EF4444]/20 text-[#FF6B6B] font-black text-[14px] active:scale-[0.98] transition-all flex items-center justify-center gap-2">
      <span>↘</span> SELL
    </button>
    <button id="stopBtn" class="h-[56px] rounded-[16px] bg-[#1A1A23] border border-[#232330] text-zinc-400 font-bold text-[13px] active:scale-[0.98] transition-all">
      STOP
    </button>
  </div>
  <p class="text-center text-[11px] text-zinc-500 mt-3 font-bold">Per Trade: <span class="text-amber-400">₹100</span> • ~0.00024 PAXG</p>

  <!-- TRADES -->
  <div class="px-5 mt-8">
    <h3 class="font-bold text-[13px] tracking-widest text-zinc-500 mb-3">LIVE TRADES</h3>
    <div id="trades" class="space-y-2 text-[12px] text-zinc-400">No trades yet — BUY dabba</div>
  </div>

</div>

<script>
let chart, candleSeries, currentTF='15m', autoInt=null;
async function loadChart(tf){
  currentTF=tf;
  document.querySelectorAll('.tf').forEach(b=>{b.className=b.dataset.tf===tf?'tf px-3 py-1.5 rounded-full bg-[#1E1E2A] text-[11px] font-bold border border-amber-500/30 text-amber-400':'tf px-3 py-1.5 rounded-full bg-[#1A1A23] text-[11px] font-bold text-zinc-500'});
  let r = await fetch(`/api/candles?interval=${tf}`);
  let data = await r.json();
  if(!data ||!data.length) return;
  let formatted = data.map(c=>({time:c.time/1000, open:c.open, high:c.high, low:c.low, close:c.close})).sort((a,b)=>a.time-b.time);
  if(!chart){
    chart = LightweightCharts.createChart(document.getElementById('chart'),{
      layout:{background:{color:'#12121A'}, textColor:'#6B7280'},
      grid:{vertLines:{color:'#1E1E2A'}, horzLines:{color:'#1E1E2A'}},
      width:document.getElementById('chart').clientWidth,
      height:320,
      priceFormat:{type:'price', precision:2, minMove:0.01}
    });
    candleSeries = chart.addCandlestickSeries({upColor:'#FBBF24', downColor:'#EF4444', borderVisible:false, wickUpColor:'#FBBF24', wickDownColor:'#EF4444'});
  }
  candleSeries.setData(formatted);
  chart.timeScale().fitContent();
}
loadChart('15m');
document.querySelectorAll('.tf').forEach(b=>b.onclick=()=>loadChart(b.dataset.tf));

async function doTrade(side){
  let btn = document.getElementById(side+'Btn');
  btn.innerHTML='...'; btn.disabled=true;
  try{
    let r = await fetch('/api/order',{method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({side})});
    let j = await r.json();
    let div = document.createElement('div');
    div.className='p-3 rounded-xl bg-[#1A1A23] border border-[#232330] flex justify-between';
    div.innerHTML=`<span class="${side==='buy'?'text-green-400':'text-red-400'} font-bold">${side.toUpperCase()} ₹100 GOLD</span><span class="text-[10px] text-zinc-500">${new Date().toLocaleTimeString()}</span>`;
    document.getElementById('trades').prepend(div);
  }catch(e){alert(e.message)}
  btn.innerHTML=side==='buy'?'↗ BUY':'↘ SELL'; btn.disabled=false;
}
document.getElementById('buyBtn').onclick=()=>doTrade('buy');
document.getElementById('sellBtn').onclick=()=>doTrade('sell');
document.getElementById('stopBtn').onclick=()=>{clearInterval(autoInt); autoInt=null; alert('Auto Stopped')};
window.addEventListener('resize',()=>chart && chart.applyOptions({width:document.getElementById('chart').clientWidth}));
</script>
</body>
</html>
