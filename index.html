<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>COINBOT PRO FIX</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>body{background:#07070B;color:#fff}.card{background:#15151D;border:1px solid #232330}</style>
</head>
<body class="p-3">
<div class="max-w-md mx-auto">
<div class="flex justify-between items-center mb-4">
<h1 class="text-2xl font-black">⚡ COIN<span class="text-violet-400">BOT</span></h1>
<div id="botStatus" class="px-3 py-1 rounded-full text-xs font-bold bg-red-500/20 text-red-400">STOP</div>
</div>

<div class="card rounded-[20px] p-4">
<p class="text-[10px] text-zinc-500">TOTAL BALANCE (REAL)</p>
<h2 class="text-4xl font-black mt-1">₹<span id="totalBal">201.38</span></h2>
<div class="grid grid-cols-2 gap-3 mt-3">
<div class="bg-[#0E0E14] rounded-xl p-3"><p class="text-[9px] text-zinc-500">INR</p><p id="inrBal" class="font-bold">₹201.38</p></div>
<div class="bg-[#0E0E14] rounded-xl p-3"><p class="text-[9px] text-zinc-500">BTC</p><p id="btcBal">0.00000</p></div>
</div>
</div>

<div class="card rounded-[20px] p-3 mt-4">
<div class="flex justify-between items-center mb-2">
<p class="text-sm font-bold">BTC/INR Live Candle</p>
<p id="livePrice" class="text-xs font-black text-violet-400">Loading...</p>
</div>
<div id="candleChart" style="height:260px;width:100%"></div>
<button onclick="localStorage.clear();location.reload();" class="mt-2 text-[10px] text-zinc-500 underline">Chart kharab lage to yahan click karo - Clear Cache</button>
</div>

<div class="card rounded-[20px] p-4 mt-4">
<div class="flex justify-between items-center">
<div>
<p id="signalText" class="text-3xl font-black">HOLD</p>
<p class="text-[11px] text-zinc-500">RSI: <span id="rsiVal" class="text-white font-bold">--</span> | <span id="trendText">Starting...</span></p>
</div>
<div id="signalIcon" class="w-12 h-12 rounded-full bg-violet-500/20 flex items-center justify-center text-xl">⚪</div>
</div>
<div class="mt-3 bg-black rounded-full h-2"><div id="confBar" class="h-full bg-violet-500" style="width:50%"></div></div>
<p class="text-right text-[10px] text-zinc-500 mt-1"><span id="confVal">50</span>% Confidence</p>
</div>

<button id="toggleBtn" class="w-full mt-4 py-4 rounded-2xl font-black bg-violet-600">START BOT 🚀</button>
<div id="logs" class="card rounded-2xl p-3 mt-4 h-24 overflow-auto text-[10px] font-mono text-zinc-400"></div>
</div>

<script>
// cache clear
localStorage.clear();
let hist=[], candles=[], chart, candleSeries, lastPrice=7461293;
const el=document.getElementById('candleChart');
chart=LightweightCharts.createChart(el,{layout:{background:{type:'solid',color:'#15151D'},textColor:'#888'},grid:{vertLines:{color:'#1E1E2A'},horzLines:{color:'#1E1E2A'}},width:el.clientWidth,height:260,rightPriceScale:{scaleMargins:{top:0.1,bottom:0.1}}});
candleSeries=chart.addCandlestickSeries({upColor:'#22c55e',downColor:'#ef4444',wickUpColor:'#22c55e',wickDownColor:'#ef4444',borderVisible:false});

function fixPrice(p){
  // agar galat bada price aaye to sahi karo
  while(p > 20000000){ p = p/1000; }
  return p;
}

function addCandle(price){
  price = fixPrice(price);
  const now=Math.floor(Date.now()/1000);
  if(candles.length===0){
    candles.push({time:now, open:price, high:price, low:price, close:price});
  } else {
    const last=candles[candles.length-1];
    if(now - last.time >= 10){
      candles.push({time:now, open:last.close, high:price, low:price, close:price});
      if(candles.length>50) candles.shift();
    } else {
      last.high=Math.max(last.high, price);
      last.low=Math.min(last.low, price);
      last.close=price;
    }
  }
  candleSeries.setData(candles);
  chart.timeScale().fitContent();
}

async function tick(){
 try{
  try{let b=await(await fetch('/api/balance')).json(); if(b.inr){document.getElementById('inrBal').innerText='₹'+parseFloat(b.inr).toFixed(2); document.getElementById('totalBal').innerText=parseFloat(b.inr).toFixed(2);}}catch(e){}
  let p;
  try{
    let cg=await(await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=inr')).json();
    p=fixPrice(cg.bitcoin.inr);
  }catch(e){ p=lastPrice + (Math.random()-0.5)*50; }
  lastPrice=p;
  document.getElementById('livePrice').innerText='₹'+Math.round(p).toLocaleString('en-IN');
  addCandle(p);
  hist.push(p); if(hist.length>40) hist.shift();
  let rsi=50; if(hist.length>14){let g=0,l=0; for(let i=1;i<hist.length;i++){let d=hist[i]-hist[i-1]; if(d>0)g+=d; else l-=d;} let rs=g/(l||0.0001); rsi=100-(100/(1+rs));}
  let sig=rsi<40?'BUY':rsi>65?'SELL':'HOLD', col=sig==='BUY'?'#22c55e':sig==='SELL'?'#ef4444':'#8b5cf6';
  document.getElementById('signalText').innerText=sig;
  document.getElementById('signalText').style.color=col;
  document.getElementById('rsiVal').innerText=rsi.toFixed(1);
  document.getElementById('trendText').innerText=rsi<40?'Oversold ↑':rsi>65?'Overbought ↓':'Neutral';
  document.getElementById('confBar').style.background=col;
  if(document.getElementById('botStatus').innerText==='RUNNING'){
    document.getElementById('logs').innerHTML=`[${new Date().toLocaleTimeString()}] ₹${Math.round(p)} RSI:${rsi.toFixed(1)} → ${sig}<br>`+document.getElementById('logs').innerHTML;
  }
 }catch(e){}
}
setInterval(tick,2000); tick();
window.addEventListener('resize',()=>chart.applyOptions({width:el.clientWidth}));
document.getElementById('toggleBtn').onclick=()=>{
 let s=document.getElementById('botStatus');
 if(s.innerText==='STOP'){s.innerText='RUNNING';s.className='px-3 py-1 rounded-full text-xs font-bold bg-green-500/20 text-green-400 border border-green-500/30';document.getElementById('toggleBtn').innerText='STOP BOT ⏹️';document.getElementById('toggleBtn').className='w-full mt-4 py-4 rounded-2xl font-black bg-zinc-800';}
 else{s.innerText='STOP';s.className='px-3 py-1 rounded-full text-xs font-bold bg-red-500/20 text-red-400 border border-red-500/30';document.getElementById('toggleBtn').innerText='START BOT 🚀';document.getElementById('toggleBtn').className='w-full mt-4 py-4 rounded-2xl font-black bg-violet-600';}
};
</script>
</body>
</html>
