<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>COINBOT FINAL PRO</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
body{background:#07070B;color:#fff;font-family:system-ui}
.card{background:#15151D;border:1px solid #232330}
</style>
</head>
<body class="p-3">
<div class="max-w-md mx-auto">

<div class="flex justify-between items-center mb-4">
<h1 class="text-2xl font-black">⚡ COIN<span class="text-violet-400">BOT</span></h1>
<div id="botStatus" class="px-3 py-1 rounded-full text-xs font-bold bg-red-500/20 text-red-400 border border-red-500/30">STOP</div>
</div>

<div class="card rounded-[20px] p-4">
<p class="text-[10px] text-zinc-500 tracking-widest">TOTAL BALANCE (REAL)</p>
<h2 class="text-4xl font-black mt-1">₹<span id="totalBal">201.38</span></h2>
<div class="grid grid-cols-2 gap-3 mt-4">
<div class="bg-[#0E0E14] rounded-xl p-3 border border-white/5"><p class="text-[9px] text-zinc-500">INR</p><p id="inrBal" class="font-bold text-sm">₹201.38</p></div>
<div class="bg-[#0E0E14] rounded-xl p-3 border border-white/5"><p class="text-[9px] text-zinc-500">BTC</p><p id="btcBal" class="font-bold text-sm">0.00000</p></div>
</div>
</div>

<div class="card rounded-[20px] p-3 mt-4">
<div class="flex justify-between items-center mb-2">
<p class="text-sm font-bold">BTC/INR Live Candle</p>
<p id="livePrice" class="text-xs font-black text-violet-400">Loading...</p>
</div>
<div id="candleChart" style="height:300px;width:100%"></div>
</div>

<div class="card rounded-[20px] p-4 mt-4">
<div class="flex justify-between items-center">
<div>
<p id="signalText" class="text-3xl font-black text-zinc-400">HOLD</p>
<p class="text-[11px] text-zinc-500 mt-1">RSI: <span id="rsiVal" class="text-white font-bold">--</span> | <span id="trendText">Neutral</span></p>
</div>
<div id="signalIcon" class="w-12 h-12 rounded-full bg-violet-500/20 flex items-center justify-center text-xl">⚪</div>
</div>
<div class="mt-4 bg-black rounded-full h-2.5 overflow-hidden"><div id="confBar" class="h-full bg-violet-500 transition-all duration-500" style="width:50%"></div></div>
<p class="text-right text-[10px] text-zinc-500 mt-1.5"><span id="confVal">50</span>% Confidence</p>
</div>

<button id="toggleBtn" class="w-full mt-5 py-4 rounded-2xl font-black bg-violet-600 active:scale-95 transition">START BOT 🚀</button>
<div id="logs" class="card rounded-2xl p-3 mt-4 h-28 overflow-auto text-[10px] font-mono text-zinc-400">Ready... Click START BOT</div>

</div>

<script>
let hist=[], candles=[], chart, candleSeries;
let lastPrice = 7464249;
const el = document.getElementById('candleChart');

chart = LightweightCharts.createChart(el, {
  layout:{background:{type:'solid',color:'#15151D'},textColor:'#888'},
  grid:{vertLines:{color:'#1E1E2A'},horzLines:{color:'#1E1E2A'}},
  width:el.clientWidth, height:300,
  timeScale:{timeVisible:true, secondsVisible:false}
});
candleSeries = chart.addCandlestickSeries({
  upColor:'#22c55e', downColor:'#ef4444',
  wickUpColor:'#22c55e', wickDownColor:'#ef4444',
  borderVisible:false
});

// Seed - ab live price ke aas paas hi banega, gap nahi
function seedCandles(basePrice){
  candles = []; hist = [];
  let now = Math.floor(Date.now()/1000) - 200;
  for(let i=0;i<25;i++){
    let open = basePrice + (Math.random()-0.5)*600;
    let close = open + (Math.random()-0.5)*500;
    let high = Math.max(open,close)+Math.random()*120;
    let low = Math.min(open,close)-Math.random()*120;
    candles.push({time:now+i*10, open, high, low, close});
    hist.push(close);
  }
  candleSeries.setData(candles);
  chart.timeScale().fitContent();
}
seedCandles(lastPrice);

function addCandle(price){
  const t = Math.floor(Date.now()/1000);
  const last = candles[candles.length-1];
  if(!last || t - last.time >= 10){
    candles.push({time:t, open:price, high:price, low:price, close:price});
    if(candles.length>70) candles.shift();
  } else {
    last.high = Math.max(last.high, price);
    last.low = Math.min(last.low, price);
    last.close = price;
  }
  candleSeries.setData(candles);
}

async function tick(){
 try{
  // Balance API
  try{
    let b = await (await fetch('/api/balance')).json();
    if(b.inr){
      document.getElementById('inrBal').innerText='₹'+parseFloat(b.inr).toFixed(2);
      document.getElementById('totalBal').innerText=parseFloat(b.inr).toFixed(2);
      if(b.btc) document.getElementById('btcBal').innerText=parseFloat(b.btc).toFixed(5);
    }
  }catch(e){}

  let p = lastPrice;
  try{
    let cg = await (await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=inr')).json();
    p = cg.bitcoin.inr;
    if(p>20000000) p=p/1000; // kabhi kabhi extra zero bug fix
  }catch(e){ p = lastPrice + (Math.random()-0.5)*80; }

  // Pehli baar agar price bahut dur hai to reseed karo
  if(Math.abs(p - lastPrice) > 1500 && candles.length<30){
    seedCandles(p);
  }

  lastPrice = p;
  document.getElementById('livePrice').innerText='₹'+Math.round(p).toLocaleString('en-IN');
  addCandle(p);

  hist.push(p); if(hist.length>40) hist.shift();

  let rsi=50;
  if(hist.length>14){
    let g=0,l=0;
    for(let i=1;i<hist.length;i++){let d=hist[i]-hist[i-1]; if(d>0)g+=d; else l-=d;}
    let rs=g/(l||0.01);
    rsi=100-(100/(1+rs));
  }

  let sig='HOLD', conf=50, col='#8b5cf6', icon='⚪', trend='Neutral', bg='bg-violet-500/20';
  if(rsi<40){sig='BUY'; conf=85; col='#22c55e'; icon='🟢'; trend='Oversold ↑'; bg='bg-green-500/20';}
  else if(rsi>65){sig='SELL'; conf=80; col='#ef4444'; icon='🔴'; trend='Overbought ↓'; bg='bg-red-500/20';}
  else {sig='HOLD'; conf=55; col='#8b5cf6'; icon='⚪'; trend='Neutral'; bg='bg-violet-500/20';}

  const sigEl=document.getElementById('signalText');
  sigEl.innerText=sig; sigEl.style.color=col;
  document.getElementById('rsiVal').innerText=rsi.toFixed(1);
  document.getElementById('trendText').innerText=trend;
  document.getElementById('confVal').innerText=conf;
  const bar=document.getElementById('confBar');
  bar.style.width=conf+'%'; bar.style.background=col;
  const iconEl=document.getElementById('signalIcon');
  iconEl.innerText=icon; iconEl.className='w-12 h-12 rounded-full flex items-center justify-center text-xl transition-all '+bg;

  if(document.getElementById('botStatus').innerText==='RUNNING'){
    document.getElementById('logs').innerHTML=`[${new Date().toLocaleTimeString()}] ₹${Math.round(p).toLocaleString('en-IN')} RSI:${rsi.toFixed(1)} → ${sig}<br>`+document.getElementById('logs').innerHTML;
  }
 }catch(e){console.log(e)}
}
setInterval(tick,2000);
tick();

window.addEventListener('resize',()=>chart.applyOptions({width:el.clientWidth}));

document.getElementById('toggleBtn').onclick=()=>{
 let s=document.getElementById('botStatus');
 if(s.innerText==='STOP'){
   s.innerText='RUNNING'; s.className='px-3 py-1 rounded-full text-xs font-bold bg-green-500/20 text-green-400 border border-green-500/30';
   document.getElementById('toggleBtn').innerText='STOP BOT ⏹️';
   document.getElementById('toggleBtn').className='w-full mt-5 py-4 rounded-2xl font-black bg-zinc-800 active:scale-95 transition';
 } else {
   s.innerText='STOP'; s.className='px-3 py-1 rounded-full text-xs font-bold bg-red-500/20 text-red-400 border border-red-500/30';
   document.getElementById('toggleBtn').innerText='START BOT 🚀';
   document.getElementById('toggleBtn').className='w-full mt-5 py-4 rounded-2xl font-black bg-violet-600 active:scale-95 transition';
 }
};
</script>
</body>
</html>
