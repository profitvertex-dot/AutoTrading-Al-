<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>COINBOT - CoinDCX Real</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>body{background:#07070B;color:#fff}.card{background:#15151D;border:1px solid #232330}</style>
</head>
<body class="p-3">
<div class="max-w-md mx-auto">
<div class="flex justify-between items-center mb-4">
<h1 class="text-2xl font-black">⚡ COIN<span class="text-violet-400">BOT</span> <span class="text-[10px] text-green-400">CoinDCX REAL</span></h1>
<div id="botStatus" class="px-3 py-1 rounded-full text-xs font-bold bg-red-500/20 text-red-400">STOP</div>
</div>

<div class="card rounded-[20px] p-4">
<p class="text-[10px] text-zinc-500">TOTAL BALANCE (REAL)</p>
<h2 class="text-4xl font-black mt-1">₹<span id="totalBal">201.38</span></h2>
<div class="grid grid-cols-2 gap-3 mt-3">
<div class="bg-[#0E0E14] rounded-xl p-3"><p class="text-[9px] text-zinc-500">INR</p><p id="inrBal" class="font-bold">₹201.38</p></div>
<div class="bg-[#0E0E14] rounded-xl p-3"><p class="text-[9px] text-zinc-500">BTC</p><p id="btcBal">0.00000</p></div>
</div>
</div>

<div class="card rounded-[20px] p-3 mt-4">
<div class="flex justify-between items-center mb-2">
<p class="text-sm font-bold">BTC/INR CoinDCX Live</p>
<p id="livePrice" class="text-xs font-black text-violet-400">Loading...</p>
</div>
<div id="candleChart" style="height:300px;width:100%"></div>
<p class="text-[9px] text-zinc-600 mt-1 text-center">Source: CoinDCX Public API • 1m candles</p>
</div>

<div class="card rounded-[20px] p-4 mt-4">
<div class="flex justify-between items-center">
<div>
<p id="signalText" class="text-3xl font-black">HOLD</p>
<p class="text-[11px] text-zinc-500">RSI: <span id="rsiVal" class="text-white font-bold">--</span> | <span id="trendText">Loading CoinDCX...</span></p>
</div>
<div id="signalIcon" class="w-12 h-12 rounded-full bg-zinc-700 flex items-center justify-center text-xl">⚪</div>
</div>
<div class="mt-3 bg-black rounded-full h-2"><div id="confBar" class="h-full bg-violet-500 transition-all" style="width:50%"></div></div>
<p class="text-right text-[10px] text-zinc-500 mt-1"><span id="confVal">50</span>% Confidence</p>
</div>

<button id="toggleBtn" class="w-full mt-4 py-4 rounded-2xl font-black bg-violet-600">START BOT 🚀</button>
<div id="logs" class="card rounded-2xl p-3 mt-4 h-28 overflow-auto text-[10px] font-mono text-zinc-400">Connecting to CoinDCX...</div>
</div>

<script>
let hist=[], candles=[], chart, candleSeries, lastPrice=0;
const el=document.getElementById('candleChart');
chart=LightweightCharts.createChart(el,{
  layout:{background:{type:'solid',color:'#15151D'},textColor:'#888'},
  grid:{vertLines:{color:'#1E1E2A'},horzLines:{color:'#1E1E2A'}},
  width:el.clientWidth, height:300,
  timeScale:{timeVisible:true, secondsVisible:false}
});
candleSeries=chart.addCandlestickSeries({upColor:'#22c55e',downColor:'#ef4444',wickUpColor:'#22c55e',wickDownColor:'#ef4444',borderVisible:false});

// COINDcx REAL CANDLES LOAD
async function loadCoinDCXReal(){
  try{
    // Try CoinDCX real endpoint
    let res = await fetch('https://public.coindcx.com/market_data/candles?pair=B-BTC_INR&interval=1m&limit=50');
    let data = await res.json();
    // API returns array of {open, high, low, close, volume, time} time in ms
    if(data && data.length>0){
      candles=[]; hist=[];
      data.forEach(c=>{
        let t = Math.floor(c.time/1000);
        candles.push({time:t, open:parseFloat(c.open), high:parseFloat(c.high), low:parseFloat(c.low), close:parseFloat(c.close)});
        hist.push(parseFloat(c.close));
      });
      lastPrice = hist[hist.length-1];
      candleSeries.setData(candles);
      chart.timeScale().fitContent();
      document.getElementById('logs').innerHTML = `[CoinDCX] ${candles.length} real candles loaded<br>` + document.getElementById('logs').innerHTML;
      return true;
    }
  }catch(e){ console.log("CoinDCX candle fail", e); }

  // Fallback: CoinGecko OHLC if CoinDCX blocked by CORS
  try{
    let res2 = await fetch('https://api.coingecko.com/api/v3/coins/bitcoin/ohlc?vs_currency=inr&days=1');
    let data2 = await res2.json();
    candles=[]; hist=[];
    data2.slice(-50).forEach(d=>{
      candles.push({time:Math.floor(d[0]/1000), open:d[1], high:d[2], low:d[3], close:d[4]});
      hist.push(d[4]);
    });
    lastPrice=hist[hist.length-1];
    candleSeries.setData(candles);
    chart.timeScale().fitContent();
    document.getElementById('logs').innerHTML = `[CoinGecko] Real candles loaded (CoinDCX CORS)<br>` + document.getElementById('logs').innerHTML;
    return true;
  }catch(e2){
    console.log("Fallback also fail");
    return false;
  }
}

function addLiveTick(price){
  const t=Math.floor(Date.now()/1000);
  const last=candles[candles.length-1];
  if(!last) return;
  // Agar naya minute hai toh nayi candle
  if(t - last.time >= 60){
    candles.push({time:t, open:price, high:price, low:price, close:price});
    if(candles.length>100) candles.shift();
  } else {
    last.high=Math.max(last.high, price);
    last.low=Math.min(last.low, price);
    last.close=price;
  }
  candleSeries.setData(candles);
  if(hist.length===0 || Math.abs(price - hist[hist.length-1])>1){
    hist.push(price); if(hist.length>40) hist.shift();
  }
}

async function tick(){
 try{
  try{let b=await(await fetch('/api/balance')).json(); if(b.inr){document.getElementById('inrBal').innerText='₹'+parseFloat(b.inr).toFixed(2); document.getElementById('totalBal').innerText=parseFloat(b.inr).toFixed(2);}}catch(e){}

  let p;
  try{
    // CoinDCX ticker for live price - exact same as app
    let tickerRes = await fetch('https://public.coindcx.com/exchange/ticker');
    let tickers = await tickerRes.json();
    let btcTicker = tickers.find(t=>t.market==='BTCINR');
    if(btcTicker) p = parseFloat(btcTicker.last_price);
    else throw "no btc ticker";
  }catch(e){
    // fallback coingecko
    try{
      let cg=await(await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=inr')).json();
      p=cg.bitcoin.inr;
    }catch(e2){ p = lastPrice || 7464000; }
  }

  lastPrice = p;
  document.getElementById('livePrice').innerText='₹'+Math.round(p).toLocaleString('en-IN');
  addLiveTick(p);

  let rsi=50;
  if(hist.length>14){
    let g=0,l=0;
    for(let i=1;i<hist.length;i++){let d=hist[i]-hist[i-1]; if(d>0)g+=d; else l-=d;}
    let rs=g/(l||0.01);
    rsi=100-(100/(1+rs));
  }

  let sig='HOLD', conf=50, col='#8b5cf6', icon='⚪', trend='Neutral', bg='bg-violet-500/20';
  if(rsi<40){sig='BUY'; conf=85; col='#22c55e'; icon='🟢'; trend='Oversold ↑'; bg='bg-green-500/20';}
  else if(rsi>65){sig='SELL'; conf=80; col='#ef4444'; icon='🔴'; trend='Overbought ↓'; bg='bg-red-500/20';}
  else {sig='HOLD'; conf=55; col='#8b5cf6'; icon='⚪'; trend='Neutral'; bg='bg-violet-500/20';}

  document.getElementById('signalText').innerText=sig;
  document.getElementById('signalText').style.color=col;
  document.getElementById('rsiVal').innerText=rsi.toFixed(1);
  document.getElementById('trendText').innerText=trend;
  document.getElementById('confVal').innerText=conf;
  document.getElementById('confBar').style.width=conf+'%';
  document.getElementById('confBar').style.background=col;
  const iconEl=document.getElementById('signalIcon');
  iconEl.innerText=icon;
  iconEl.className='w-12 h-12 rounded-full flex items-center justify-center text-xl '+bg;

  if(document.getElementById('botStatus').innerText==='RUNNING'){
    document.getElementById('logs').innerHTML=`[${new Date().toLocaleTimeString('en-IN',{timeZone:'Asia/Kolkata'})}] CoinDCX ₹${Math.round(p).toLocaleString('en-IN')} RSI:${rsi.toFixed(1)} → ${sig}<br>`+document.getElementById('logs').innerHTML;
  }
 }catch(e){}
}

// INIT
(async()=>{
  await loadCoinDCXReal();
  setInterval(tick,3000);
  tick();
  // Har 60 sec me real candles reload taaki refresh jaisa na lage
  setInterval(loadCoinDCXReal, 60000);
})();

window.addEventListener('resize',()=>chart.applyOptions({width:el.clientWidth}));

document.getElementById('toggleBtn').onclick=()=>{
 let s=document.getElementById('botStatus');
 if(s.innerText==='STOP'){s.innerText='RUNNING';s.className='px-3 py-1 rounded-full text-xs font-bold bg-green-500/20 text-green-400 border border-green-500/30';document.getElementById('toggleBtn').innerText='STOP BOT ⏹️';document.getElementById('toggleBtn').className='w-full mt-4 py-4 rounded-2xl font-black bg-zinc-800';}
 else{s.innerText='STOP';s.className='px-3 py-1 rounded-full text-xs font-bold bg-red-500/20 text-red-400 border border-red-500/30';document.getElementById('toggleBtn').innerText='START BOT 🚀';document.getElementById('toggleBtn').className='w-full mt-4 py-4 rounded-2xl font-black bg-violet-600';}
};
</script>
</body>
</html>
