<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font-family:Arial;padding:12px;padding-bottom:20px}
.top{display:flex;gap:10px}.top button{flex:1;padding:14px;border-radius:16px;font-weight:700;border:1px solid #222}
.btn-demo.active{background:#fff;color:#000} .btn-demo{background:#111;color:#888}
.btn-real.active{background:#8b5cf6;color:#fff;border:none} .btn-real{background:#111;color:#888}
.header{display:flex;align-items:center;gap:12px;margin:16px 0}.logo{width:52px;height:52px;border-radius:14px;background:#111;border:1px solid #222}
.card{background:#141416;border-radius:22px;padding:16px;border:1px solid #1e1e22}
.bal{font-size:40px;font-weight:900}
.chart-wrap{margin-top:14px;background:#111114;border-radius:22px;padding:8px;border:1px solid #1e1e22}
.chart-opt{display:flex;gap:6px;margin-bottom:8px;overflow:auto}
.chart-opt button{background:#1e1e24;color:#888;border:none;padding:8px 12px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap}
.chart-opt button.active{background:#8b5cf6;color:#fff}
#chart{width:100%;height:400px}
.row{display:flex;gap:12px;margin-top:14px}.box{background:#121215;border-radius:18px;padding:14px;flex:1;border:1px solid #1e1e22}
.btns{display:flex;gap:12px;margin-top:14px}.btn{flex:1;padding:18px;border-radius:16px;border:none;font-weight:900}
.btn-buy{background:#00c853;color:#fff} .btn-sell{background:#e53935;color:#fff}
.btn-bot{background:#8b5cf6;color:#fff;width:100%;padding:18px;border-radius:16px;border:none;font-weight:900;margin-top:14px;font-size:18px}
.logs{background:#0c0c0e;border-radius:16px;padding:10px;margin-top:12px;font-size:11px;color:#888;max-height:150px;overflow:auto;border:1px solid #1a1a1a}
</style></head><body>

<div class="top">
<button id="demoBtn" class="btn-demo" onclick="setMode('demo')">🖊️ DEMO ₹10K</button>
<button id="realBtn" class="btn-real active" onclick="setMode('real')">💰 REAL CoinDCX</button>
</div>

<div class="header">
<img src="logo.png" class="logo">
<div><div style="font-size:20px;font-weight:800">AutoTrading <span style="color:#a78bfa">AI</span></div><div style="color:#00ff88;font-size:12px" id="liveTxt">● REAL CoinDCX Live • PAXG GOLD</div></div>
<button style="margin-left:auto;background:#1a0a0a;color:#ff4d4d;border:1px solid #3a1a1a;padding:8px 16px;border-radius:18px;font-weight:800">STOP</button>
</div>

<div class="card">
<div style="display:flex;justify-content:space-between;align-items:center">
<div><div style="color:#666;font-size:12px">TOTAL BALANCE</div><div class="bal">₹<span id="inrBal">482.22</span></div><div style="color:#555;font-size:12px" id="paxgBal">REAL PAXG GOLD</div></div>
<button style="background:#8b5cf6;color:#fff;border:none;padding:10px 18px;border-radius:22px;font-weight:700" onclick="loadBal()">✅ Connected</button>
</div>
</div>

<div class="chart-wrap">
<div class="chart-opt">
<button class="active" id="tf-5m" onclick="setTF('5m')">5m REAL</button>
<button id="tf-15m" onclick="setTF('15m')">15m</button>
<button id="tf-1h" onclick="setTF('1h')">1h</button>
<button id="tf-1d" onclick="setTF('1d')">1D</button>
<span style="color:#666;font-size:11px;margin-left:auto;padding:8px" id="priceTxt">PAXG/INR Loading...</span>
</div>
<div id="chart"></div>
</div>

<div class="row">
<div class="box"><div style="color:#777;font-size:11px">MODE</div><div style="font-size:20px;font-weight:900" id="modeTxt">REAL</div><div style="color:#666;font-size:11px">PAXG GOLD</div></div>
<div class="box"><div style="color:#777;font-size:11px">TODAY P/L</div><div style="font-size:20px;font-weight:900;color:#00ff88">+₹0.00</div><div style="color:#666;font-size:11px" id="signal">AI: BUY GOLD</div></div>
</div>

<div class="btns">
<button class="btn btn-buy" onclick="doTrade('buy')">BUY GOLD 🚀</button>
<button class="btn btn-sell" onclick="doTrade('sell')">SELL GOLD ▼</button>
</div>
<button class="btn-bot" id="botBtn" onclick="toggleBot()">START BOT 🚀 GOLD</button>
<div class="logs" id="logs">✅ REAL CoinDCX chart loaded<br></div>

<script>
let MODE=localStorage.getItem('mode')||'real', TF='5m', chart, candleSeries, BOT=false;
function setMode(m){
 MODE=m; localStorage.setItem('mode',m);
 document.getElementById('demoBtn').className=m==='demo'?'btn-demo active':'btn-demo';
 document.getElementById('realBtn').className=m==='real'?'btn-real active':'btn-real';
 document.getElementById('modeTxt').innerText=m.toUpperCase();
 document.getElementById('liveTxt').innerText=m==='demo'?'● DEMO ₹10K • PAXG':'● REAL CoinDCX Live • PAXG GOLD';
 addLog('Switched to '+m.toUpperCase()); loadBal();
}
function addLog(t){document.getElementById('logs').innerHTML=t+"<br>"+document.getElementById('logs').innerHTML;}
function initChart(){
 const el=document.getElementById('chart');
 chart=LightweightCharts.createChart(el,{layout:{background:{color:'#111114'},textColor:'#888'},grid:{vertLines:{color:'#1e1e24'},horzLines:{color:'#1e1e24'}},rightPriceScale:{borderColor:'#222'},timeScale:{borderColor:'#222',timeVisible:true},width:el.clientWidth,height:400});
 candleSeries=chart.addCandlestickSeries({upColor:'#00ff88',downColor:'#ff3b3b',wickUpColor:'#00ff88',wickDownColor:'#ff3b3b',borderVisible:false});
 window.addEventListener('resize',()=>chart.applyOptions({width:el.clientWidth}));
}
function setTF(tf){
 TF=tf; document.querySelectorAll('[id^="tf-"]').forEach(b=>b.classList.remove('active')); document.getElementById('tf-'+tf).classList.add('active'); loadChart();
}
async function loadChart(){
 try{
  const map={'5m':'5m','15m':'15m','1h':'1h','1d':'1d'};
  const r=await fetch(`https://public.coindcx.com/market_data/candles?pair=B-PAXG_INR&interval=${map[TF]}&limit=120`);
  const d=await r.json();
  const data=d.map(c=>({time:Math.floor(c.time/1000),open:c.open,high:c.high,low:c.low,close:c.close})).sort((a,b)=>a.time-b.time);
  candleSeries.setData(data); chart.timeScale().fitContent();
  const last=data[data.length-1]; document.getElementById('priceTxt').innerText=`PAXG ₹${last.close.toFixed(2)} • ${TF} • CoinDCX REAL`;
  document.getElementById('signal').innerText=`AI: ${last.close>last.open?'BUY GOLD':'SELL GOLD'} @ ₹${last.close.toFixed(2)}`;
 }catch(e){addLog('Chart err '+e.message)}
}
async function loadBal(){try{let r=await fetch('/api/balance',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:MODE})});let d=await r.json();if(Array.isArray(d)){let inr=d.find(x=>x.currency==='INR');let paxg=d.find(x=>x.currency==='PAXG');if(inr)document.getElementById('inrBal').innerText=Number(inr.balance).toFixed(2);if(paxg)document.getElementById('paxgBal').innerText=(MODE==='demo'?'DEMO • ':'REAL • ')+Number(paxg.balance).toFixed(5)+' PAXG';}}catch(e){}}
async function doTrade(side){addLog(`🚀 ${MODE.toUpperCase()} ${side.toUpperCase()} ₹500...`);let r=await fetch('/api/order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({side,mode:MODE})});let j=await r.json();addLog(`✅ ${JSON.stringify(j).slice(0,200)}`);loadBal();}
function toggleBot(){BOT=!BOT;let b=document.getElementById('botBtn');b.innerText=BOT?"STOP BOT ⏹️ GOLD":"START BOT 🚀 GOLD";b.style.background=BOT?"#e53935":"#8b5cf6";}
initChart(); setMode(MODE); loadChart(); loadBal(); setInterval(loadChart,15000);
</script></body></html>
