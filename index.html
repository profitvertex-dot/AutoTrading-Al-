<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AutoTrading AI - SHIB LIVE</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
<style>body{background:#07070B;color:#fff}.card{background:#15151D;border:1px solid #232330}</style>
</head>
<body class="p-3 pb-28">
<div class="max-w-md mx-auto">
<div class="flex gap-2 mb-4">
<button onclick="setAccount('demo')" id="demoBtn" class="flex-1 py-2.5 rounded-xl font-black text-[12px] border bg-[#1E1E2A]">DEMO ₹10K</button>
<button onclick="setAccount('real')" id="realBtn" class="flex-1 py-2.5 rounded-xl font-black text-[12px] border bg-violet-600">REAL CoinDCX</button>
</div>
<div class="card rounded-[22px] p-4"><p class="text-[10px] text-zinc-500 font-bold">TOTAL BALANCE</p><h2 class="text-4xl font-black mt-1">₹<span id="bal">0.00</span></h2><p class="text-[11px] text-zinc-500 mt-1"><span id="balSub">Real</span> • <span id="price">₹0</span></p></div>
<div class="card rounded-[22px] p-3 mt-4"><div id="tv" style="height:360px;width:100%"></div></div>
<div class="grid grid-cols-2 gap-3 mt-4"><div class="card rounded-2xl p-4"><p class="text-[10px] text-zinc-500">AI SIGNAL</p><p id="sig" class="text-2xl font-black mt-1">HOLD</p></div><div class="card rounded-2xl p-4"><p class="text-[10px] text-zinc-500">TODAY P/L</p><p id="pnl" class="text-xl font-black text-green-400 mt-1">+₹0.00</p><p class="text-[11px] text-zinc-500"><span id="trades">0 trades</span></p></div></div>
<div id="homePage">
<div class="grid grid-cols-2 gap-3 mt-3"><button onclick="manualTrade('BUY')" class="py-3.5 bg-green-600 rounded-2xl font-black text-sm">BUY 🚀</button><button onclick="manualTrade('SELL')" class="py-3.5 bg-red-600 rounded-2xl font-black text-sm">SELL 🔻</button></div>
<div id="logs" class="card rounded-2xl p-3 mt-3 h-32 overflow-auto text-[10px] font-mono text-zinc-400">Ready<br></div>
</div>
<div id="historyPage" class="hidden"><h2 class="text-[18px] font-black mb-3">📜 History</h2><div id="historyList" class="space-y-2"></div><button onclick="clearHistory()" class="w-full mt-4 py-2.5 bg-red-500/20 text-red-400 border rounded-xl text-[11px] font-black">Clear History</button></div>
</div>
<div class="fixed bottom-0 left-0 right-0 bg-[#0F0F14] border-t border-[#232330] p-2"><div class="max-w-md mx-auto flex gap-2"><button onclick="showPage('home')" id="navHome" class="flex-1 py-3 rounded-xl font-black text-[12px] bg-violet-600">🏠 HOME</button><button onclick="showPage('history')" id="navHist" class="flex-1 py-3 rounded-xl font-black text-[12px] bg-[#1E1E2A] text-zinc-400">📊 HISTORY</button></div></div>
<script>
let accountMode=localStorage.getItem('accMode')||'real';
let balances=JSON.parse(localStorage.getItem('balances')||'{"demo":10000,"real":477.14}');
let tradesCount=JSON.parse(localStorage.getItem('tradesCount')||'{"demo":0,"real":0}');
let tradeHistory=JSON.parse(localStorage.getItem('tradeHistory')||'[]');
let candles=[],chart,candleSeries,position=null;
const el=document.getElementById('tv');
chart=LightweightCharts.createChart(el,{layout:{background:{color:'#15151D'},textColor:'#999'},grid:{vertLines:{color:'#1E1E2A'},horzLines:{color:'#1E1E2A'}},width:el.clientWidth,height:360});
candleSeries=chart.addCandlestickSeries({upColor:'#22c55e',downColor:'#ef4444',borderVisible:false,wickUpColor:'#22c55e',wickDownColor:'#ef4444'});

function showPage(p){document.getElementById('homePage').classList.toggle('hidden',p!='home');document.getElementById('historyPage').classList.toggle('hidden',p!='history');if(p=='history')renderHistory();}
function saveAll(){localStorage.setItem('balances',JSON.stringify(balances));localStorage.setItem('tradesCount',JSON.stringify(tradesCount));localStorage.setItem('tradeHistory',JSON.stringify(tradeHistory));localStorage.setItem('accMode',accountMode);}
function setAccount(m){accountMode=m;saveAll();document.getElementById('bal').innerText=balances[m].toFixed(2);document.getElementById('trades').innerText=tradesCount[m]+' trades';document.getElementById('balSub').innerText=m;}
function addHist(type,price,orderId){tradeHistory.unshift({time:new Date().toLocaleString('en-IN'),mode:accountMode,type:type,price:price,orderId:orderId||''});tradesCount[accountMode]++;saveAll();setAccount(accountMode);}
function renderHistory(){let h='';tradeHistory.filter(t=>t.mode==accountMode).forEach(t=>{h+=`<div class="card rounded-xl p-3"><div class="flex justify-between"><p class="text-[11px] font-black ${t.type=='BUY'?'text-green-400':'text-red-400'}">${t.type} @ ₹${t.price}</p><p class="text-[9px] text-zinc-500">${t.time}</p></div><p class="text-[8px] text-zinc-600 mt-1">ID: ${t.orderId}</p></div>`});document.getElementById('historyList').innerHTML=h||'<p class="text-center text-zinc-500 text-[12px] mt-10">No trades</p>';}
function clearHistory(){tradeHistory=tradeHistory.filter(t=>t.mode!=accountMode);tradesCount[accountMode]=0;saveAll();renderHistory();setAccount(accountMode);}
async function manualTrade(type){let price=candles[candles.length-1]?.close||0.00148;let orderId='';if(type=='BUY'){let ro=await fetch('/api/order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({side:'buy'})});let rj=await ro.json();orderId=rj.orders?.[0]?.id||rj.id||'ok';document.getElementById('logs').innerHTML=`✅ BUY ${orderId}<br>`+document.getElementById('logs').innerHTML;setTimeout(async()=>{let br=await fetch('/api/balance');let bj=await br.json();balances.real=bj.balance;saveAll();setAccount('real');},3000);}else{let ro=await fetch('/api/order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({side:'sell'})});let rj=await ro.json();orderId=rj.orders?.[0]?.id||rj.id||'ok';document.getElementById('logs').innerHTML=`✅ SELL ${orderId}<br>`+document.getElementById('logs').innerHTML;setTimeout(async()=>{let br=await fetch('/api/balance');let bj=await br.json();balances.real=bj.balance;saveAll();setAccount('real');},3000);}addHist(type,price,orderId);}
async function load(){try{let r=await fetch(`/api/candles?interval=15m`);let d=await r.json();d=d.reverse();candles=d.map(c=>({time:Math.floor(c.time/1000),open:parseFloat(c.open),high:parseFloat(c.high),low:parseFloat(c.low),close:parseFloat(c.close)}));candleSeries.setData(candles);chart.timeScale().fitContent();let last=candles[candles.length-1].close;document.getElementById('price').innerText=last>1?'₹'+Math.round(last).toLocaleString('en-IN'):'₹'+last.toFixed(7);}catch(e){}}
setAccount(accountMode);load();setInterval(load,60000);renderHistory();
</script>
</body>
</html>
