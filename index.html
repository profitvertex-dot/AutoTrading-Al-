<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AutoTrading AI</title>
<link rel="icon" href="logo.png">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
<style>body{background:#07070B;color:#fff}.card{background:#15151D;border:1px solid #232330}</style>
</head>
<body class="p-3">
<div class="max-w-md mx-auto">
<div class="flex items-center justify-between mb-4">
<div class="flex items-center gap-3"><img src="logo.png" class="w-11 h-11 rounded-xl"><div><h1 class="font-black">AutoTrading <span class="text-violet-400">AI</span></h1><p class="text-[9px] text-zinc-500">LIVE • REAL PRICE</p></div></div>
<div id="botStatus" class="px-3 py-1 rounded-full text-xs bg-red-500/20 text-red-400 font-bold">STOP</div>
</div>

<div class="card rounded-2xl p-4"><p class="text-[10px] text-zinc-500">TOTAL BALANCE</p><h2 class="text-4xl font-black">₹201.38</h2></div>

<div class="card rounded-2xl p-3 mt-4">
<div class="flex justify-between mb-2"><p class="text-sm font-bold">🟢 BTC/INR Live</p><p id="livePrice" class="text-sm font-bold text-violet-400">Loading...</p></div>
<div id="chart" style="height:360px"></div>
</div>

<div class="card rounded-2xl p-4 mt-4 flex justify-between"><div><p id="sig" class="text-2xl font-black">HOLD</p><p class="text-xs text-zinc-500">RSI <span id="rsi">--</span></p></div><div id="icon" class="w-12 h-12 bg-zinc-800 rounded-full flex items-center justify-center">⚪</div></div>

<button id="btn" class="w-full mt-4 py-4 bg-violet-600 rounded-2xl font-black">START BOT 🚀</button>
<div id="logs" class="card rounded-2xl p-3 mt-3 h-24 overflow-auto text-[10px] font-mono">Ready...</div>
</div>

<script>
let hist=[], data=[], chart, series;
const el=document.getElementById('chart');
chart=LightweightCharts.createChart(el,{layout:{background:{color:'#15151D'},textColor:'#888'},grid:{vertLines:{color:'#1E1E2A'},horzLines:{color:'#1E1E2A'}},width:el.clientWidth,height:360});
series=chart.addLineSeries({color:'#8b5cf6',lineWidth:2});

async function loadHistory(){
  try{
    // CoinGecko history - 1 day, no CORS block
    let r=await fetch('https://api.coingecko.com/api/v3/coins/bitcoin/market_chart?vs_currency=inr&days=1');
    let j=await r.json();
    data=[]; hist=[];
    j.prices.slice(-80).forEach(p=>{
      let t=Math.floor(p[0]/1000);
      let price=p[1];
      data.push({time:t,value:price});
      hist.push(price);
    });
    series.setData(data);
    chart.timeScale().fitContent();
    document.getElementById('logs').innerHTML+='<br>✅ Chart loaded';
  }catch(e){document.getElementById('logs').innerHTML+='<br>❌ History fail: '+e;}
}

async function tick(){
  try{
    let r=await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=inr');
    let j=await r.json();
    let p=j.bitcoin.inr;
    document.getElementById('livePrice').innerText='₹'+Math.round(p).toLocaleString('en-IN');
    let t=Math.floor(Date.now()/1000);
    data.push({time:t,value:p}); if(data.length>150) data.shift();
    series.setData(data);
    hist.push(p); if(hist.length>50) hist.shift();
    let rsi=50; if(hist.length>14){let g=0,l=0;for(let i=1;i<hist.length;i++){let d=hist[i]-hist[i-1];if(d>0)g+=d;else l-=d;}let rs=g/(l||0.01);rsi=100-(100/(1+rs));}
    document.getElementById('sig').innerText=rsi<38?'BUY':rsi>68?'SELL':'HOLD';
    document.getElementById('rsi').innerText=rsi.toFixed(1);
  }catch(e){}
}

loadHistory();
setInterval(tick,3000);

document.getElementById('btn').onclick=()=>{
  let s=document.getElementById('botStatus');
  if(s.innerText==='STOP'){s.innerText='RUNNING';s.className='px-3 py-1 rounded-full text-xs bg-green-500/20 text-green-400 font-bold';document.getElementById('btn').innerText='STOP BOT';}
  else{s.innerText='STOP';s.className='px-3 py-1 rounded-full text-xs bg-red-500/20 text-red-400 font-bold';document.getElementById('btn').innerText='START BOT 🚀';}
};
window.addEventListener('resize',()=>chart.applyOptions({width:el.clientWidth}));
</script>
</body>
</html>
