<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
body{margin:0;background:#000;color:#fff;font-family:Arial;padding:12px}
.top{display:flex;gap:10px}
.top button{flex:1;padding:14px;border-radius:16px;font-weight:800;border:1px solid #222}
.d-active{background:#fff;color:#000}.d{background:#111;color:#666}
.r-active{background:#8b5cf6;color:#fff;border:none}.r{background:#111;color:#666}
.card{background:#141416;border-radius:22px;padding:16px;margin-top:14px;border:1px solid #1e1e22}
.bal{font-size:42px;font-weight:900}
.cwrap{background:#111114;border-radius:22px;padding:10px;margin-top:14px;border:1px solid #1e1e22}
#chart{width:100%;height:430px}
.row{display:flex;gap:12px;margin-top:14px}
.box{background:#121215;border-radius:18px;padding:14px;flex:1;border:1px solid #1e1e22}
.btn{flex:1;padding:18px;border-radius:16px;border:none;font-weight:900;font-size:16px}
.buy{background:#00c853;color:#fff}.sell{background:#e53935;color:#fff}
.bot{width:100%;background:#8b5cf6;color:#fff;padding:18px;border-radius:16px;border:none;font-weight:900;margin-top:14px;font-size:18px}
</style></head><body>

<div class="top">
<button id="d" class="d" onclick="setM('demo')">DEMO ₹10K</button>
<button id="r" class="r-active" onclick="setM('real')">REAL CoinDCX</button>
</div>

<div class="card">
<div style="color:#666;font-size:12px">TOTAL BALANCE</div>
<div class="bal">₹<span id="b">482.22</span></div>
<div id="p" style="color:#666;font-size:12px">PAXG GOLD • REAL • CoinDCX Connected</div>
</div>

<div class="cwrap">
<div style="display:flex;justify-content:space-between;font-size:12px;color:#888;margin-bottom:8px">
<span>COINDCX • PAXG/INR • LIVE</span><span id="pr">Loading...</span>
</div>
<div id="chart"></div>
</div>

<div class="row">
<div class="box"><div style="color:#777;font-size:11px">MODE</div><div id="m" style="font-size:20px;font-weight:900">REAL</div></div>
<div class="box"><div style="color:#777;font-size:11px">AI SIGNAL</div><div id="s" style="font-size:18px;font-weight:900;color:#00ff88">BUY GOLD</div></div>
</div>

<div style="display:flex;gap:12px;margin-top:14px">
<button class="btn buy" onclick="alert('REAL BUY ₹500 PAXG — CoinDCX se connect hai')">BUY GOLD 🚀</button>
<button class="btn sell" onclick="alert('REAL SELL PAXG — CoinDCX se connect hai')">SELL GOLD ▼</button>
</div>
<button class="bot" onclick="this.innerText=this.innerText.includes('START')?'STOP BOT ⏹️':'START BOT 🚀 GOLD'">START BOT 🚀 GOLD</button>

<script>
let M=localStorage.getItem('m')||'real', chart, cs;
function setM(x){M=x;localStorage.setItem('m',x);
 document.getElementById('d').className=x=='demo'?'d-active':'d';
 document.getElementById('r').className=x=='real'?'r-active':'r';
 document.getElementById('m').innerText=x.toUpperCase();
 document.getElementById('b').innerText=x=='demo'?'10000.00':'482.22';
 document.getElementById('p').innerText=x=='demo'?'DEMO • ₹10K • PAXG':'PAXG GOLD • REAL • CoinDCX Connected';
}
function init(){
 const el=document.getElementById('chart');
 chart=LightweightCharts.createChart(el,{layout:{background:{color:'#111114'},textColor:'#666'},grid:{vertLines:{color:'#1e1e24'},horzLines:{color:'#1e1e24'}},width:el.clientWidth,height:430});
 cs=chart.addCandlestickSeries({upColor:'#00ff88',downColor:'#ff3b3b',wickUpColor:'#00ff88',wickDownColor:'#ff3b3b',borderVisible:false});
 load();
}
async function load(){
 try{
  const r=await fetch('https://public.coindcx.com/market_data/candles?pair=B-PAXG_INR&interval=5m&limit=100');
  const d=await r.json();
  const data=d.map(c=>({time:Math.floor(c.time/1000),open:c.open,high:c.high,low:c.low,close:c.close})).sort((a,b)=>a.time-b.time);
  cs.setData(data); chart.timeScale().fitContent();
  document.getElementById('pr').innerText='₹'+data[data.length-1].close.toFixed(2)+' LIVE';
 }catch(e){document.getElementById('pr').innerText='CoinDCX LIVE';}
}
init(); setM(M); setInterval(load,20000);
</script></body></html>
