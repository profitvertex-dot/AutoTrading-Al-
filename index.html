<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AutoTrading AI - CoinDCX LIVE</title>
<link rel="icon" href="logo.png">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
<style>body{background:#07070B;color:#fff}.card{background:#15151D;border:1px solid #232330}.active-acc{background:#8b5cf6!important;color:white!important}</style>
</head>
<body class="p-3 pb-24">
<div class="max-w-md mx-auto">
<div class="flex gap-2 mb-4">
<button id="demoBtn" onclick="setAccount('demo')" class="active-acc flex-1 py-2.5 rounded-xl font-black text-[12px] border bg-[#1E1E2A]">🧪 DEMO ₹10K</button>
<button id="realBtn" onclick="setAccount('real')" class="flex-1 py-2.5 rounded-xl font-black text-[12px] border bg-[#1E1E2A] text-zinc-400">💰 REAL CoinDCX</button>
</div>
<div class="flex items-center justify-between mb-4">
<div class="flex items-center gap-3"><img src="logo.png" class="w-11 h-11 rounded-xl"><div><h1 class="font-black text-[16px]">AutoTrading <span class="text-violet-400">AI</span></h1><p id="accLabel" class="text-[9px] text-green-400 font-bold">● DEMO MODE</p></div></div>
<div id="status" class="px-3 py-1.5 rounded-full text-[11px] font-black bg-red-500/15 text-red-400 border border-red-500/20">STOP</div>
</div>
<div class="card rounded-[22px] p-4">
<div class="flex justify-between items-center"><div><p class="text-[10px] text-zinc-500 font-bold">TOTAL BALANCE</p><h2 class="text-4xl font-black mt-1">₹<span id="bal">10000.00</span></h2><p id="balSub" class="text-[11px] text-zinc-500 mt-1">Demo Balance</p></div><button id="connectBtn" onclick="connectReal()" class="px-4 py-2 bg-violet-600 rounded-xl text-xs font-black">Connect CoinDCX 🔑</button></div>
</div>
<div class="card rounded-[22px] p-3 mt-4">
<div class="flex justify-between items-center mb-2">
<div class="flex gap-1.5"><button onclick="setTF('1')" id="tf1" class="active-acc px-3 py-1 rounded-full text-[11px] font-bold bg-[#1E1E2A]">1D</button><button onclick="setTF('7')" id="tf7" class="px-3 py-1 rounded-full text-[11px] font-bold bg-[#1E1E2A] text-zinc-400">7D</button></div>
<p id="price" class="text-[13px] font-black text-violet-400 bg-violet-500/10 px-3 py-1 rounded-full">Loading...</p>
</div>
<div id="tv" style="height:400px;width:100%"></div>
</div>
<div class="grid grid-cols-2 gap-3 mt-4">
<div class="card rounded-2xl p-4"><p class="text-[10px] text-zinc-500 font-bold">AI SIGNAL</p><p id="sig" class="text-2xl font-black mt-1">HOLD</p><p class="text-[11px] text-zinc-500">RSI <span id="rsi" class="text-white font-bold">--</span></p></div>
<div class="card rounded-2xl p-4"><p class="text-[10px] text-zinc-500 font-bold">TODAY P/L</p><p id="pnl" class="text-xl font-black text-green-400 mt-1">+₹0.00</p><p class="text-[11px] text-zinc-500"><span id="trades">0 trades</span> • <span id="modeTag">DEMO</span> • CoinDCX LIVE</p></div>
</div>
<div class="grid grid-cols-2 gap-3 mt-3"><button onclick="manualTrade('BUY')" class="py-3.5 bg-green-600 rounded-2xl font-black text-sm">BUY 🚀</button><button onclick="manualTrade('SELL')" class="py-3.5 bg-red-600 rounded-2xl font-black text-sm">SELL 🔻</button></div>
<button id="btn" class="w-full mt-3 py-4 rounded-2xl font-black bg-violet-600">START BOT 🚀</button>
<div id="logs" class="card rounded-2xl p-3 mt-3 h-32 overflow-auto text-[10px] font-mono text-zinc-400">🤖 CoinDCX LIVE Chart Connected<br></div>
</div>
<script>
let accountMode=localStorage.getItem('accMode')||'demo';
let balances=JSON.parse(localStorage.getItem('balances')||'{"demo":10000,"real":200}');
let tradesCount=JSON.parse(localStorage.getItem('tradesCount')||'{"demo":0,"real":0}');
let pnl=JSON.parse(localStorage.getItem('pnl')||'{"demo":0,"real":0}');
let candles=[],chart,candleSeries,markers=[],currentTF='1',lastSignalTime=0,position=null;
const el=document.getElementById('tv');
chart=LightweightCharts.createChart(el,{layout:{background:{color:'#15151D'},textColor:'#999'},grid:{vertLines:{color:'#1E1E2A'},horzLines:{color:'#1E1E2A'}},width:el.clientWidth,height:400,timeScale:{timeVisible:true,borderColor:'#232330'},rightPriceScale:{borderColor:'#232330'}});
candleSeries=chart.addCandlestickSeries({upColor:'#22c55e',downColor:'#ef4444',borderUpColor:'#22c55e',borderDownColor:'#ef4444',wickUpColor:'#22c55e',wickDownColor:'#ef4444'});
function setAccount(mode){
  accountMode=mode;localStorage.setItem('accMode',mode);
  document.getElementById('demoBtn').className=mode=='demo'?'active-acc flex-1 py-2.5 rounded-xl font-black text-[12px] border bg-[#1E1E2A]':'flex-1 py-2.5 rounded-xl font-black text-[12px] border bg-[#1E1E2A] text-zinc-400';
  document.getElementById('realBtn').className=mode=='real'?'active-acc flex-1 py-2.5 rounded-xl font-black text-[12px] border bg-[#1E1E2A]':'flex-1 py-2.5 rounded-xl font-black text-[12px] border bg-[#1E1E2A] text-zinc-400';
  document.getElementById('accLabel').innerText=mode=='demo'?'● DEMO ₹10000':'● REAL CoinDCX Live';
  document.getElementById('bal').innerText=balances[mode].toFixed(2);
  document.getElementById('balSub').innerText=mode=='demo'?'Demo Practice Balance':'Real CoinDCX Balance';
  document.getElementById('modeTag').innerText=mode.toUpperCase();
  document.getElementById('connectBtn').style.display=mode=='real'?'block':'none';
  document.getElementById('trades').innerText=tradesCount[mode]+' trades';
  document.getElementById('pnl').innerText=(pnl[mode]>=0?'+':'')+'₹'+pnl[mode].toFixed(2);
}
async function connectReal(){
  document.getElementById('logs').innerHTML=`⏳ CoinDCX se real balance le raha hu...<br>`+document.getElementById('logs').innerHTML;
  document.getElementById('connectBtn').innerText='Loading...';
  try{
    let r=await fetch('/api/balance'); let j=await r.json();
    if(j.success||j.balance){ balances.real=j.balance||200; localStorage.setItem('balances',JSON.stringify(balances)); setAccount('real'); document.getElementById('connectBtn').innerText='✅ Connected'; document.getElementById('logs').innerHTML=`✅ REAL Balance: ₹${j.balance}<br>`+document.getElementById('logs').innerHTML; }
    else{ document.getElementById('connectBtn').innerText='Connect 🔑'; alert('Error: '+JSON.stringify(j)); }
  }catch(e){ document.getElementById('connectBtn').innerText='Connect 🔑'; alert('API file nahi mila'); }
}
function manualTrade(type){
  let price=candles[candles.length-1]?.close||7358807;
  if(type=='BUY'&&!position){position={price};document.getElementById('logs').innerHTML=`🟢 ${accountMode.toUpperCase()} BUY @ ₹${Math.round(price).toLocaleString()}<br>`+document.getElementById('logs').innerHTML;if(accountMode=='real'&&document.getElementById('status').innerText=='RUNNING'){placeRealOrder('buy',price);}}
  else if(type=='SELL'&&position){let profit=(price-position.price)/position.price*100;let profitAmt=balances[accountMode]*0.1*profit/100;pnl[accountMode]+=profitAmt;balances[accountMode]+=profitAmt;tradesCount[accountMode]++;position=null;localStorage.setItem('balances',JSON.stringify(balances));localStorage.setItem('pnl',JSON.stringify(pnl));localStorage.setItem('tradesCount',JSON.stringify(tradesCount));setAccount(accountMode);document.getElementById('logs').innerHTML=`🔴 ${accountMode.toUpperCase()} SELL ${profit.toFixed(2)}%<br>`+document.getElementById('logs').innerHTML;if(accountMode=='real'&&document.getElementById('status').innerText=='RUNNING'){placeRealOrder('sell',price);}}
}
async function placeRealOrder(side, price){
  try{
    let qty = (180 / price); if(qty < 0.00001) qty = 0.00001;
    document.getElementById('logs').innerHTML=`🚀 REAL ${side.toUpperCase()} CoinDCX Order...<br>`+document.getElementById('logs').innerHTML;
    let ro = await fetch('/api/order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({side:side, amount:qty})});
    let rj = await ro.json();
    document.getElementById('logs').innerHTML=`✅ CoinDCX: ${JSON.stringify(rj).slice(0,150)}<br>`+document.getElementById('logs').innerHTML;
    setTimeout(connectReal, 3000);
  }catch(e){document.getElementById('logs').innerHTML=`❌ Order fail: ${e.message}<br>`+document.getElementById('logs').innerHTML;}
}
function setTF(days){currentTF=days;document.querySelectorAll('[id^=tf]').forEach(b=>b.className='px-3 py-1 rounded-full text-[11px] font-bold bg-[#1E1E2A] text-zinc-400');document.getElementById('tf'+days).className='active-acc px-3 py-1 rounded-full text-[11px] font-bold bg-[#1E1E2A]';load();}

// *** COINDCX LIVE CHART - 100% ***
async function load(){
  try{
    let interval = currentTF=='1'?'1m':'15m';
    let r = await fetch(`https://public.coindcx.com/market_data/candles?pair=I-BTC_INR&interval=${interval}&limit=200`);
    let d = await r.json();
    if(!Array.isArray(d) || d.length==0) throw 'no data';
    d = d.reverse();
    candles = d.map(c=>({time: Math.floor(c.time/1000), open: parseFloat(c.open), high: parseFloat(c.high), low: parseFloat(c.low), close: parseFloat(c.close)}));
    candleSeries.setData(candles);
    chart.timeScale().fitContent();
    document.getElementById('price').innerText='₹'+Math.round(candles[candles.length-1].close).toLocaleString('en-IN');
    document.getElementById('logs').innerHTML=`📊 CoinDCX Candle Loaded: ${candles.length} LIVE<br>`+document.getElementById('logs').innerHTML;
    calcRSI();
  }catch(e){
    document.getElementById('logs').innerHTML=`⚠️ CoinDCX fail, CoinGecko fallback<br>`+document.getElementById('logs').innerHTML;
    let r2=await fetch(`https://api.coingecko.com/api/v3/coins/bitcoin/ohlc?vs_currency=inr&days=${currentTF}`);
    let d2=await r2.json();candles=d2.map(c=>({time:Math.floor(c[0]/1000),open:c[1],high:c[2],low:c[3],close:c[4]}));candleSeries.setData(candles);chart.timeScale().fitContent();
  }
}
async function tick(){
  try{
    let r = await fetch('https://api.coindcx.com/exchange/ticker');
    let j = await r.json();
    let btc = j.find(x=>x.market=='BTCINR');
    if(!btc) return;
    let p = parseFloat(btc.last_price);
    document.getElementById('price').innerText='₹'+Math.round(p).toLocaleString('en-IN');
    let last=candles[candles.length-1]; if(!last)return;
    last.close=p; last.high=Math.max(last.high,p); last.low=Math.min(last.low,p);
    candleSeries.update(last);
    calcRSI();
  }catch(e){}
}
async function calcRSI(){
  if(candles.length<15)return;
  let cl=candles.map(c=>c.close);let g=0,l=0;
  for(let i=cl.length-14;i<cl.length;i++){let diff=cl[i]-cl[i-1];if(diff>=0)g+=diff;else l-=diff;}
  let rs=(g/14)/((l/14)||0.00001); let rsi=100-(100/(1+rs));
  document.getElementById('rsi').innerText=rsi.toFixed(1);
  let sig=rsi<35?'BUY':rsi>70?'SELL':'HOLD';
  document.getElementById('sig').innerText=sig;
  let now=Date.now();
  if(sig!='HOLD'&&now-lastSignalTime>90000){
    lastSignalTime=now;
    let last=candles[candles.length-1];
    markers.push({time:last.time,position:sig=='BUY'?'belowBar':'aboveBar',color:sig=='BUY'?'#22c55e':'#ef4444',shape:sig=='BUY'?'arrowUp':'arrowDown',text:sig});
    if(markers.length>10)markers.shift();candleSeries.setMarkers(markers);
    document.getElementById('logs').innerHTML=`🤖 CoinDCX Signal: ${sig} RSI ${rsi.toFixed(1)}<br>`+document.getElementById('logs').innerHTML;
    let status=document.getElementById('status').innerText;
    if(accountMode=='real' && status=='RUNNING'){ await placeRealOrder(sig.toLowerCase(), last.close); }
    else if(accountMode=='demo' && status=='RUNNING'){ manualTrade(sig); }
  }
}
setAccount(accountMode);load();setInterval(tick,3000);setInterval(load,60000);
document.getElementById('btn').onclick=()=>{
  let s=document.getElementById('status'),b=document.getElementById('btn');
  if(s.innerText==='STOP'){s.innerText='RUNNING';s.className='px-3 py-1.5 rounded-full text-[11px] font-black bg-green-500/15 text-green-400 border border-green-500/20';b.innerText='STOP BOT ⏹️';b.className='w-full mt-3 py-4 rounded-2xl font-black bg-red-500';document.getElementById('logs').innerHTML=`▶️ BOT STARTED ${accountMode.toUpperCase()} - CoinDCX LIVE<br>`+document.getElementById('logs').innerHTML;}
  else{s.innerText='STOP';s.className='px-3 py-1.5 rounded-full text-[11px] font-black bg-red-500/15 text-red-400 border border-red-500/20';b.innerText='START BOT 🚀';b.className='w-full mt-3 py-4 rounded-2xl font-black bg-violet-600';document.getElementById('logs').innerHTML=`⏹️ BOT STOPPED<br>`+document.getElementById('logs').innerHTML;}
};
</script>
</body>
</html>
