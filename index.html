<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#000;color:#fff;font-family:Arial;padding:12px;padding-bottom:90px}
.top{display:flex;gap:10px}
.top button{flex:1;padding:14px;border-radius:16px;font-weight:700;font-size:13px}
.btn-demo{background:#111;color:#888;border:1px solid #222}
.btn-real{background:#8b5cf6;color:#fff;border:none}
.header{display:flex;align-items:center;gap:12px;margin:16px 0}
.logo{width:52px;height:52px;border-radius:14px;background:#111;border:1px solid #222}
.title{font-size:20px;font-weight:800} .title span{color:#a78bfa}
.live{color:#00ff88;font-size:12px}
.stop{margin-left:auto;background:#1a0a0a;color:#ff4d4d;border:1px solid #3a1a1a;padding:8px 16px;border-radius:18px;font-weight:800}
.card{background:#141416;border-radius:22px;padding:16px;border:1px solid #1e1e22}
.bal{font-size:40px;font-weight:900}
.chart-wrap{background:#111114;border-radius:22px;padding:8px;border:1px solid #1e1e22;margin-top:14px}
.chart-opt{display:flex;gap:8px;margin-bottom:8px}
.chart-opt button{background:#1e1e24;color:#888;border:none;padding:8px 12px;border-radius:20px;font-size:12px;font-weight:700}
.chart-opt button.active{background:#8b5cf6;color:#fff}
#chart{width:100%;height:380px}
.row{display:flex;gap:12px;margin-top:14px}
.box{background:#121215;border-radius:18px;padding:14px;flex:1;border:1px solid #1e1e22}
.btns{display:flex;gap:12px;margin-top:14px}
.btn{flex:1;padding:16px;border-radius:16px;border:none;font-weight:900}
.btn-buy{background:#00c853;color:#fff} .btn-sell{background:#e53935;color:#fff}
.btn-bot{background:#8b5cf6;color:#fff;width:100%;padding:16px;border-radius:16px;border:none;font-weight:900;margin-top:14px}
.nav{position:fixed;bottom:0;left:0;right:0;background:#000;padding:10px;display:flex;gap:10px;border-top:1px solid #1a1a1a}
.nav button{flex:1;padding:14px;border-radius:14px;border:none;font-weight:800}
</style>
</head>
<body>

<div class="top">
<button class="btn-demo">🖊️ DEMO ₹10K</button>
<button class="btn-real">💰 REAL CoinDCX</button>
</div>

<div class="header">
<img src="logo.png" class="logo">
<div><div class="title">AutoTrading <span>AI</span></div><div class="live">● REAL CoinDCX Live • PAXG GOLD</div></div>
<button class="stop" onclick="toggleBot()">STOP</button>
</div>

<div class="card">
<div style="display:flex;justify-content:space-between;align-items:center">
<div><div style="color:#666;font-size:12px">TOTAL BALANCE</div><div class="bal">₹<span id="inrBal">482.22</span></div><div style="color:#555;font-size:12px" id="paxgBal">GOLD • PAXG</div></div>
<button style="background:#8b5cf6;color:#fff;border:none;padding:10px 18px;border-radius:22px;font-weight:700" onclick="loadBal()">✅ Connected</button>
</div>
</div>

<div class="chart-wrap">
<div class="chart-opt">
<button class="active" onclick="setType('candle')" id="b-candle">Candle 🕯️</button>
<button onclick="setType('line')" id="b-line">Line 📈</button>
<button onclick="setType('area')" id="b-area">Area 🌊</button>
<button onclick="setTF('1m')" id="tf-1m">1m</button>
<button onclick="setTF('5m')" class="active" id="tf-5m">5m</button>
<button onclick="setTF('15m')" id="tf-15m">15m</button>
</div>
<div id="chart"></div>
<div style="display:flex;justify-content:space-between;margin-top:6px;color:#666;font-size:11px"><span id="signal">AI: LOADING...</span><span id="priceTxt">PAXG/INR</span></div>
</div>

<div class="row">
<div class="box"><div style="color:#777;font-size:11px">AI SIGNAL</div><div style="font-size:26px;font-weight:900" id="signal2">HOLD</div></div>
<div class="box"><div style="color:#777;font-size:11px">P/L GOLD</div><div style="font-size:22px;font-weight:900;color:#00ff88">+₹0.00</div></div>
</div>

<div class="btns">
<button class="btn btn-buy" onclick="doTrade('buy')">BUY GOLD 🚀</button>
<button class="btn btn-sell" onclick="doTrade('sell')">SELL GOLD ▼</button>
</div>
<button class="btn-bot" id="botBtn" onclick="toggleBot()">START BOT 🚀 GOLD</button>

<div class="nav"><button style="background:#8b5cf6;color:#fff">🏠 HOME</button><button style="background:#1e1e24;color:#888">📊 HISTORY</button></div>

<script>
let BOT=false, TF='5m', TYPE='candle', chart, candleSeries, lineSeries, areaSeries;

function initChart(){
  const el=document.getElementById('chart');
  chart=LightweightCharts.createChart(el,{layout:{background:{color:'#111114'},textColor:'#666'},grid:{vertLines:{color:'#1a1a1e'},horzLines:{color:'#1a1a1e'}},rightPriceScale:{borderColor:'#222'},timeScale:{borderColor:'#222',timeVisible:true},width:el.clientWidth,height:380});
  candleSeries=chart.addCandlestickSeries({upColor:'#00ff88',downColor:'#ff3b3b',wickUpColor:'#00ff88',wickDownColor:'#ff3b3b',borderVisible:false});
  lineSeries=chart.addLineSeries({color:'#8b5cf6',lineWidth:2}); lineSeries.applyOptions({visible:false});
  areaSeries=chart.addAreaSeries({topColor:'rgba(139,92,246,0.4)',bottomColor:'rgba(139,92,246,0)',lineColor:'#8b5cf6'}); areaSeries.applyOptions({visible:false});
  window.addEventListener('resize',()=>{chart.applyOptions({width:el.clientWidth})});
}
function setType(t){
  TYPE=t;
  document.querySelectorAll('.chart-opt button').forEach(b=>{if(['b-candle','b-line','b-area'].includes(b.id)) b.classList.remove('active')});
  document.getElementById('b-'+t).classList.add('active');
  candleSeries.applyOptions({visible:t==='candle'});
  lineSeries.applyOptions({visible:t==='line'});
  areaSeries.applyOptions({visible:t==='area'});
}
function setTF(tf){
  TF=tf;
  document.querySelectorAll('[id^=\"tf-\"]').forEach(b=>b.classList.remove('active'));
  document.getElementById('tf-'+tf).classList.add('active');
  loadChart();
}
async function loadChart(){
  try{
    const r=await fetch(`https://public.coindcx.com/market_data/candles?pair=B-PAXG_INR&interval=${TF}&limit=120`);
    const d=await r.json();
    if(!d||!d.length) throw 'no data';
    const data=d.map(c=>({time:Math.floor(c.time/1000),open:c.open,high:c.high,low:c.low,close:c.close,value:c.close})).sort((a,b)=>a.time-b.time);
    candleSeries.setData(data);
    lineSeries.setData(data.map(x=>({time:x.time,value:x.close})));
    areaSeries.setData(data.map(x=>({time:x.time,value:x.close})));
    chart.timeScale().fitContent();
    const last=data[data.length-1];
    document.getElementById('priceTxt').innerText=`PAXG ₹${last.close.toFixed(2)} • ${TF}`;
    const sig=last.close>last.open?'BUY GOLD':'SELL GOLD';
    document.getElementById('signal').innerText=`AI: ${sig} @ ₹${last.close.toFixed(2)}`;
    const s2=document.getElementById('signal2'); s2.innerText=sig.includes('BUY')?'BUY':'SELL'; s2.style.color=sig.includes('BUY')?'#00ff88':'#ff3b3b';
  }catch(e){console.log(e)}
}
async function loadBal(){try{let r=await fetch('/api/balance',{method:'POST'});let d=await r.json();if(Array.isArray(d)){let inr=d.find(x=>x.currency==='INR');if(inr)document.getElementById('inrBal').innerText=Number(inr.balance).toFixed(2);}}catch(e){}}
async function doTrade(side){let r=await fetch('/api/order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({side,market:"PAXGINR"})});}
function toggleBot(){BOT=!BOT;document.getElementById('botBtn').innerText=BOT?"STOP BOT ⏹️ GOLD":"START BOT 🚀 GOLD";document.getElementById('botBtn').style.background=BOT?"#e53935":"#8b5cf6";}

initChart(); loadChart(); loadBal(); setInterval(loadChart,15000);
</script>
</body>
</html>
