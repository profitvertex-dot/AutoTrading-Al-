<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BTC Auto Bot - REAL</title>
<style>
body{background:#0b0e11;color:#fff;font-family:Arial;padding:15px}
.card{background:#151a21;padding:15px;border-radius:12px;margin-bottom:12px;border:1px solid #222}
.big{font-size:32px;font-weight:bold}
.green{color:#0ecb81}.red{color:#f6465d}.yellow{color:#f3ba2f}
.btn{width:100%;padding:12px;border:0;border-radius:8px;font-weight:bold;margin-top:10px}
</style>
</head>
<body>
<div class="card">
<div>Balance: <span id="bal">₹--</span> <small id="balType"></small></div>
<div class="big" id="price">Loading...</div>
<div>BTC/USDT: <span id="price2">--</span></div>
<div>Signal: <b id="sig">--</b> | Confidence: <b id="conf">--</b> | RSI: <b id="rsi">--</b></div>
<div style="margin-top:10px">Last Entry: <span id="entry">@ --</span> | PnL: <span id="pnl">--</span></div>
<button class="btn" id="tradeBtn" style="background:#2b3139;color:#fff" onclick="toggleBot()">Bot: STOP</button>
<div style="font-size:12px;margin-top:8px;color:#888">Real trading ON - 0.0001 BTC test order</div>
</div>

<div class="card" id="log" style="height:200px;overflow:auto;font-size:12px"></div>

<script>
let baseBal=100011, entryPrice=0, botOn=false, lastPrice=0, rsi=50;
let prices=[];

function addLog(m){
 let d=document.createElement('div');
 d.innerText=new Date().toLocaleTimeString()+' - '+m;
 document.getElementById('log').prepend(d);
}

// REAL BALANCE
async function updateBalance(){
 try{
  let r=await fetch('/api/balance');
  let d=await r.json();
  if(d.balance){
    baseBal=parseFloat(d.balance);
    document.getElementById('bal').innerText='₹'+baseBal.toFixed(2);
    document.getElementById('balType').innerText = d.demo? '(DEMO)' : '(REAL CoinDCX)';
    if(d.demo) document.getElementById('balType').style.color='#f3ba2f';
  }
 }catch(e){ document.getElementById('bal').innerText='₹'+baseBal.toFixed(2); }
}
updateBalance();
setInterval(updateBalance, 15000);

// LIVE PRICE + RSI FIX
async function updatePrice(){
 try{
  let r=await fetch('https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT');
  let d=await r.json();
  lastPrice=parseFloat(d.price);
  prices.push(lastPrice);
  if(prices.length>14) prices.shift();

  // RSI Calc
  if(prices.length>=14){
    let gains=0,losses=0;
    for(let i=1;i<prices.length;i++){
      let diff=prices[i]-prices[i-1];
      if(diff>0) gains+=diff; else losses-=diff;
    }
    let rs = gains/(losses||1);
    rsi = 100 - (100/(1+rs));
  }

  document.getElementById('price').innerText='$'+lastPrice.toFixed(2);
  document.getElementById('price2').innerText='$'+lastPrice.toFixed(2);
  document.getElementById('rsi').innerText=rsi.toFixed(1);

  // SIGNAL LOGIC
  let signal='HOLD', conf=50;
  if(rsi<30){ signal='BUY'; conf=85; }
  else if(rsi>70){ signal='SELL'; conf=85; }
  else if(rsi<40){ signal='BUY'; conf=65; }
  else if(rsi>60){ signal='SELL'; conf=65; }

  document.getElementById('sig').innerText=signal;
  document.getElementById('sig').className = signal=='BUY'?'green':signal=='SELL'?'red':'yellow';
  document.getElementById('conf').innerText=conf+'%';

  // AUTO TRADE - REAL ORDER
  if(botOn && conf>75 && signal!='HOLD'){
    if(entryPrice==0 || (signal=='SELL' && lastPrice>entryPrice) || (signal=='BUY' && lastPrice<entryPrice*0.99)){
      if(signal=='BUY'){
        entryPrice=lastPrice;
        document.getElementById('entry').innerText='@ $'+entryPrice.toFixed(2);
        addLog('BUY @ $'+lastPrice.toFixed(2)+' RSI:'+rsi.toFixed(1));
        placeRealOrder('buy');
      }else if(signal=='SELL' && entryPrice>0){
        let pnl = ((lastPrice-entryPrice)/entryPrice*100).toFixed(2);
        document.getElementById('pnl').innerText=pnl+'%';
        addLog('SELL @ $'+lastPrice.toFixed(2)+' PnL:'+pnl+'%');
        placeRealOrder('sell');
        entryPrice=0;
      }
    }
  }

 }catch(e){ addLog('Price error'); }
}

async function placeRealOrder(side){
 try{
  let r=await fetch('/api/place-order',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({side: side, price: lastPrice})
  });
  let d=await r.json();
  addLog('REAL ORDER '+side.toUpperCase()+' : '+JSON.stringify(d).substring(0,100));
 }catch(e){ addLog('Order fail: '+e.message); }
}

function toggleBot(){
 botOn=!botOn;
 let b=document.getElementById('tradeBtn');
 b.innerText='Bot: '+(botOn?'RUNNING':'STOP');
 b.style.background=botOn?'#0ecb81':'#2b3139';
 addLog(botOn?'Bot STARTED - REAL MODE':'Bot STOPPED');
}

setInterval(updatePrice, 3000);
updatePrice();
</script>
</body>
</html>
