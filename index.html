<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AutoTrading AI</title>
<link rel="icon" href="logo.png">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
<style>body{background:#07070B;color:#fff}.card{background:#15151D;border:1px solid #232330}</style>
</head>
<body class="p-3 pb-20">
<div class="max-w-md mx-auto">
<div class="flex items-center justify-between mb-4"><div class="flex items-center gap-3"><img src="logo.png" class="w-11 h-11 rounded-xl"><div><h1 class="font-black">AutoTrading <span class="text-violet-400">AI</span></h1><p class="text-[9px] text-zinc-500">LIVE • REAL PRICE</p></div></div><div id="st" class="px-3 py-1 rounded-full text-xs bg-red-500/20 text-red-400 font-bold">STOP</div></div>

<div class="card rounded-[22px] p-4"><p class="text-[10px] text-zinc-500">TOTAL BALANCE</p><h2 class="text-4xl font-black">₹201.38</h2></div>

<div class="card rounded-[22px] p-3 mt-4">
<div class="flex justify-between mb-2"><p class="text-sm font-bold">🟢 BTC/INR Live Candles</p><p id="pr" class="text-sm font-bold text-violet-400">Loading...</p></div>
<div id="tv" style="height:420px;width:100%"></div>
</div>

<div class="card rounded-2xl p-4 mt-4 flex justify-between items-center"><div><p id="sig" class="text-3xl font-black">HOLD</p><p class="text-xs text-zinc-500">RSI <span id="rsi">--</span></p></div><div id="ic" class="w-12 h-12 rounded-full bg-zinc-800 flex items-center justify-center">⚪</div></div>
<button id="btn" class="w-full mt-4 py-4 bg-violet-600 rounded-2xl font-black">START BOT 🚀</button>
</div>

<script>
let candles=[], chart, candleSeries;
const el=document.getElementById('tv');
chart=LightweightCharts.createChart(el,{layout:{background:{color:'#15151D'},textColor:'#999'},grid:{vertLines:{color:'#1E1E2A'},horzLines:{color:'#1E1E2A'}},width:el.clientWidth,height:420,timeScale:{timeVisible:true},rightPriceScale:{borderColor:'#232330'}});
candleSeries=chart.addCandlestickSeries({upColor:'#22c55e',downColor:'#ef4444',borderUpColor:'#22c55e',borderDownColor:'#ef4444',wickUpColor:'#22c55e',wickDownColor:'#ef4444'});

async function load(){
 let r=await fetch('https://api.coingecko.com/api/v3/coins/bitcoin/ohlc?vs_currency=inr&days=1');
 let d=await r.json();
 candles=d.map(c=>({time:Math.floor(c[0]/1000),open:c[1],high:c[2],low:c[3],close:c[4]}));
 candleSeries.setData(candles);
 chart.timeScale().fitContent();
 document.getElementById('pr').innerText='₹'+Math.round(candles[candles.length-1].close).toLocaleString('en-IN');
}
async function tick(){
 let r=await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=inr');
 let j=await r.json(); let p=j.bitcoin.inr;
 document.getElementById('pr').innerText='₹'+Math.round(p).toLocaleString('en-IN');
 let last=candles[candles.length-1]; if(!last) return;
 last.close=p; last.high=Math.max(last.high,p); last.low=Math.min(last.low,p);
 candleSeries.update(last);
 let cl=candles.map(c=>c.close); let g=0,l=0; for(let i=cl.length-14;i<cl.length;i++){let d=cl[i]-cl[i-1]; if(d>0)g+=d;else l-=d;} let rsi=100-(100/(1+g/(l||0.01)));
 document.getElementById('rsi').innerText=rsi.toFixed(1);
 let sig=rsi<40?'BUY':rsi>65?'SELL':'HOLD';
 document.getElementById('sig').innerText=sig;
 document.getElementById('ic').innerText=sig=='BUY'?'📈':sig=='SELL'?'📉':'⚪';
}
load(); setInterval(tick,3000); setInterval(load,60000);
document.getElementById('btn').onclick=()=>{let s=document.getElementById('st'); s.innerText=s.innerText=='STOP'?'RUNNING':'STOP';};
window.addEventListener('resize',()=>chart.applyOptions({width:el.clientWidth}));
</script>
</body>
</html>
