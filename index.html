<!DOCTYPE html>
<html>
<head>
<title>AutoTrading AI - LIVE</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white p-4">
<h1 class="text-2xl font-bold">AutoTrading AI <span class="text-green-400 text-xs">● LIVE CoinDCX</span></h1>

<div class="grid grid-cols-2 gap-3 mt-4">
<div class="bg-zinc-900 p-3 rounded-lg">Balance: ₹<span id="bal">Loading...</span></div>
<div class="bg-zinc-900 p-3 rounded-lg">Status: <span id="status">STOPPED</span></div>
</div>

<button id="btn" class="mt-4 w-full py-3 bg-green-500 rounded-full font-bold text-black">START BOT</button>

<div class="mt-4 bg-zinc-900 p-3 rounded-lg">
<p>BTC Price: ₹<span id="price">Loading...</span></p>
<p>Signal: <span id="signal">HOLD</span></p>
<p>AI Confidence: <span id="conf">0</span>%</p>
</div>

<div class="mt-4 bg-zinc-900 p-3 rounded-lg">
<h2 class="font-bold">Trade History</h2>
<div id="history" class="text-xs mt-2">No trades yet</div>
</div>

<script>
let on=false, trades=[], realBal=0;

async function getBalance(){
  try{
    let r = await fetch('/api/balance');
    let data = await r.json();
    console.log(data);
    // CoinDCX returns array
    if(Array.isArray(data)){
      let inr = data.find(x=>x.currency=='INR');
      if(inr){ realBal=parseFloat(inr.balance); document.getElementById('bal').innerText=realBal.toFixed(2); }
    } else {
      document.getElementById('bal').innerText = JSON.stringify(data).slice(0,100);
    }
  }catch(e){ document.getElementById('bal').innerText='Error'; }
}

async function getPrice(){
  try{
    let r = await fetch('/api/ticker');
    let data = await r.json();
    let btc = data['BTCINR'] || data['btcinr'] || 0;
    if(btc) document.getElementById('price').innerText=btc;
  }catch(e){}
}

getBalance(); getPrice();
setInterval(getPrice,5000);

let btn=document.getElementById('btn');
btn.onclick=()=>{
 on=!on;
 document.getElementById('status').innerText= on? "ACTIVE 🟢 LIVE" : "STOPPED 🔴";
 btn.innerText= on? "STOP BOT" : "START BOT";
 btn.className= on? "mt-4 w-full py-3 bg-red-500 rounded-full font-bold text-black" : "mt-4 w-full py-3 bg-green-500 rounded-full font-bold text-black";
}

setInterval(()=>{
 if(!on) return;
 let priceEl = document.getElementById('price').innerText;
 let rsi = Math.floor(Math.random()*60+20);
 let signal = rsi<35? "BUY" : rsi>65? "SELL" : "HOLD";
 let conf = Math.floor(Math.random()*30+70);
 document.getElementById('signal').innerText=signal;
 document.getElementById('conf').innerText=conf;
 if(conf>75 && signal!="HOLD"){
   trades.unshift(`${signal} @ ${priceEl} | Conf: ${conf}% | ${new Date().toLocaleTimeString()}`);
   document.getElementById('history').innerHTML=trades.join('<br>');
 }
},2000);
</script>
</body>
</html>
