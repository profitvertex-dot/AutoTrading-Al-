<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body{font-family:'Space Grotesk',sans-serif;background:#0a0a0f; color:white}
.glass{background:rgba(255,255,255,0.05); backdrop-filter:blur(20px); border:1px solid rgba(255,255,255,0.1)}
.neon{box-shadow:0 0 30px rgba(139,92,246,0.3)}
</style>
</head>
<body class="p-4">
<div class="max-w-md mx-auto">
  <!-- Header -->
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-2xl font-bold">⚡ COIN<span class="text-violet-400">BOT</span></h1>
    <div id="botStatus" class="px-4 py-1 rounded-full text-xs font-bold bg-red-500/20 text-red-400 border border-red-500/30">STOP</div>
  </div>

  <!-- Balance Card -->
  <div class="glass neon rounded-[24px] p-5 mb-4">
    <p class="text-xs text-zinc-400 tracking-widest">TOTAL BALANCE (REAL)</p>
    <h2 class="text-4xl font-bold mt-1">₹<span id="totalBal">201.38</span></h2>
    <div class="grid grid-cols-2 gap-3 mt-5">
      <div class="bg-white/[0.05] rounded-2xl p-3">
        <p class="text-[10px] text-zinc-500">INR</p>
        <p id="inrBal" class="font-bold text-lg">₹201.38</p>
      </div>
      <div class="bg-white/[0.05] rounded-2xl p-3">
        <p class="text-[10px] text-zinc-500">BTC</p>
        <p id="btcBal" class="font-bold text-lg">0.00000</p>
      </div>
    </div>
  </div>

  <!-- Signal Card -->
  <div class="glass rounded-[24px] p-5 mb-4">
    <div class="flex justify-between items-center">
      <div>
        <p id="signalText" class="text-3xl font-bold">HOLD</p>
        <p class="text-xs text-zinc-500 mt-1">RSI: <span id="rsiVal">--</span> | Entry: <span id="entryVal">--</span></p>
      </div>
      <div class="w-16 h-16 rounded-full bg-violet-500/20 flex items-center justify-center text-2xl" id="signalIcon">⚪</div>
    </div>
    <div class="mt-4 bg-black/50 rounded-full h-2 overflow-hidden">
      <div id="confBar" class="h-full bg-violet-500 transition-all" style="width:50%"></div>
    </div>
    <p class="text-right text-[10px] mt-1 text-zinc-500"><span id="confVal">0</span>% Confidence</p>
  </div>

  <!-- Controls -->
  <button id="toggleBtn" class="w-full py-4 rounded-2xl font-bold bg-violet-600 hover:bg-violet-500 transition">START BOT 🚀</button>

  <!-- Logs -->
  <div class="glass rounded-2xl p-3 mt-4 h-40 overflow-y-auto text-[11px] font-mono" id="logs">Logs loading...</div>
</div>
<script src="/app.js"></script>
</body>
</html>
