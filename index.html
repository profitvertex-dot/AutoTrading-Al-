<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AutoTrading AI - SHIB LIVE</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
body{background:#07070B;color:#fff}
.card{background:#15151D;border:1px solid #232330}
.active-acc{background:#8b5cf6!important;color:white!important}
.nav-active{background:#8b5cf6;color:white}
</style>
</head>
<body class="p-3 pb-28">
<div class="max-w-md mx-auto">

<!-- ACC SWITCH -->
<div class="flex gap-2 mb-4">
<button id="demoBtn" onclick="setAccount('demo')" class="flex-1 py-2.5 rounded-xl font-black text-[12px] border bg-[#1E1E2A] text-zinc-400">🧪 DEMO ₹10K</button>
<button id="realBtn" onclick="setAccount('real')" class="active-acc flex-1 py-2.5 rounded-xl font-black text-[12px] border">💰 REAL CoinDCX</button>
</div>

<!-- HEADER -->
<div class="flex items-center justify-between mb-4">
<div class="flex items-center gap-3">
<img src="/logo.png" class="w-11 h-11 rounded-[12px] bg-[#1E1E2A] border border-[#232330] object-cover shadow-lg shadow-violet-500/20" alt="AI" />
<div>
<h1 class="font-black text-[16px]">AutoTrading <span class="text-violet-400">AI</span></h1>
<p id="accLabel" class="text-[9px] text-green-400 font-bold">● REAL SHIB LIVE</p>
</div>
</div>
<div id="status" class="px-3 py-1.5 rounded-full text-[11px] font-black bg-red-500/15 text-red-400 border">STOP</div>
</div>

<!-- BALANCE -->
<div id="homePage">
<div class="card rounded-[22px] p-4">
<div class="flex justify-between">
<div>
<p class="text-[10px] text-zinc-500 font-bold">TOTAL BALANCE</p>
<h2 class="text-4xl font-black mt-1">₹<span id="bal">477.14</span></h2>
<p id="balSub" class="text-[11px] text-zinc-500 mt-1">Real • <span id="price">₹0.0005125</span></p>
</div>
<button id="connectBtn" onclick="connectReal()" class="px-4 py-2 bg-violet-600 rounded-xl text-xs font-black">Refresh 🔄</button>
</div>
</div>

<!-- CHART -->
<div class="card rounded-[22px] p-3 mt-4">
<div class="flex justify-between mb-2">
<div class="flex gap-1.5">
<button onclick="setTF('1')" id="tf1" class="active-acc px-3 py-1 rounded-full text-[11px] font-bold">1D</button>
<button onclick="setTF('7')" id="tf7" class="px-3 py-1 rounded-full text-[11px] font-bold bg-[#1E1E2A] text-zinc-400">7D</button>
</div>
<p id="tfLabel" class="text-[11px] text-zinc-500">SHIB/INR • 15m</p>
</div>
<div id="tv" style="height:360px;width:100%"></div>
</div>

<!-- STATS -->
<div class="grid grid-cols-2 gap-3 mt-4">
<div class="card rounded-2xl p-4">
<p class="text-[10px] text-zinc-500 font-bold">AI SIGNAL</p>
<p id="sig" class="text-2xl font-black mt-1">HOLD</p>
<p class="text-[11px] text-zinc-500">RSI <span id="rsi">--</span></p>
</div>
<div class="card rounded-2xl p-4">
<p class="text-[10px] text-zinc-500 font-bold">TODAY P/L</p>
<p id="pnl" class="text-xl font-black text-green-400 mt-1">+₹0.00</p>
<p class="text-[11px] text-zinc-500"><span id="trades">0 trades</span> • <span id="modeTag">REAL</span></p>
</div>
</div>

<!-- BUTTONS -->
<div class="grid grid-cols-2 gap-3 mt-3">
<button onclick="manualTrade('BUY')" class="py-3.5 bg-green-600 rounded-2xl font-black text-sm">BUY 🚀</button>
<button onclick="manualTrade('SELL')" class="py-3.5 bg-red-600 rounded-2xl font-black text-sm">SELL 🔻</button>
</div>
<button id="btn" class="w-full mt-3 py-4 rounded-2xl font-black bg-violet-600">START BOT 🚀</button>
<div id="logs" class="card rounded-2xl p-3 mt-3 h-36 overflow-auto text-[10px] font-mono text-zinc-400">🤖 Ready - SHIB LIVE 400k<br>✅ Balance loaded<br></div>
</div>

<!-- HISTORY PAGE -->
<div id="historyPage" class="hidden">
<h2 class="text-[18px] font-black mb-3">📜 History</h2>
<div id="historyList" class="space-y-2"></div>
<button onclick="clearHistory()" class="w-full mt-4 py-2.5 bg-red-500/20 text-red-400 border border-red-500/30 rounded-xl text-[11px] font-black">Clear History</button>
</div>

</div>

<!-- BOTTOM NAV -->
<div class="fixed bottom-0 left-0 right-0 bg-[#0F0F14] border-t border-[#232330] p-2">
<div class="max-w-md mx-auto flex gap-2">
<button id="navHome" onclick="showPage('home')" class="nav-active flex-1 py-3 rounded-xl font-black text-[12px]">🏠 HOME</button>
<button id="navHist" onclick="showPage('history')" class="flex-1 py-3 rounded-xl font-black text-[12px] bg-[#1E1E2A] text-zinc-400">📊 HISTORY</button>
</div>
</div>

<script>
let accountMode=localStorage.getItem('accMode')||'real';
let balances=JSON.parse(localStorage.getItem('balances')||'{"demo":10000,"real":477.14}');
let tradesCount=JSON.parse(localStorage.getItem('tradesCount')||'{"demo":0,"real":0}');
let tradeHistory=JSON.parse(localStorage.getItem('tradeHistory')||'[]');
let candles=[],chart,candleSeries,position=null,currentTF='1';
const el=document.getElementById('tv');
chart=LightweightCharts.createChart(el,{layout:{background:{color:'#15151D'},textColor:'#999'},grid:{vertLines:{color:'#1E1E2A'},horzLines:{color:'#1E1E2A'}},width:el.clientWidth,height:360});
candleSeries=chart.addCandlestickSeries({upColor:'#22c55e',downColor:'#ef4444',borderVisible:false,wickUpColor:'#22c55e',wickDownColor:'#ef4444'});

function showPage(p){
document.getElementById('homePage').classList.toggle('hidden',p!='home');
document.getElementById('historyPage').classList.toggle('hidden',p!='history');
document.getElementById('navHome').className=p=='home'?'nav-active flex-1 py-3 rounded-xl font-black text-[12px]':'flex-1 py-3 rounded-xl font-black text-[12px] bg-[#1E1E2A] text-zinc-400';
document.getElementById('navHist').className=p=='history'?'nav-active flex-1 py-3 rounded-xl font-black text-[12px]':'flex-1 py-3 rounded-xl font-black text-[12px] bg-[#1E1E2A] text-zinc-400';
if(p=='history')renderHistory();
}
function saveAll(){
localStorage.setItem('balances',JSON.stringify(balances));
localStorage.setItem('tradesCount',JSON.stringify(tradesCount));
localStorage.setItem('tradeHistory',JSON.stringify(tradeHistory));
localStorage.setItem('accMode',accountMode);
}
function setAccount(m){
accountMode=m;
saveAll();
document.getElementById('demoBtn').className=m=='demo'?'active-acc flex-1 py-2.5 rounded-xl font-black text-[12px] border':'flex-1 py-2.5 rounded-xl font-black text-[12px] border bg-[#1E1E2A] text-zinc-400';
document.getElementById('realBtn').className=m=='real'?'active-acc flex-1 py-2.5 rounded-xl font-black text-[12px] border':'flex-1 py-2.5 rounded-xl font-black text-[12px] border bg-[#1E1E2A] text-zinc-400';
document.getElementById('accLabel').innerText=m=='demo'?'● DEMO MODE':'● REAL SHIB LIVE';
document.getElementById('bal').innerText=balances[m].toFixed(2);
document.getElementById('balSub').innerHTML=`${m} • <span id="price">${document.getElementById('price').innerText}</span>`;
document.getElementById('modeTag').innerText=m.toUpperCase();
document.getElementById('trades').innerText=tradesCount[m]+' trades';
}
async function connectReal(){
try{
let r=await fetch('/api/balance');
let j=await r.json();
if(j.balance!=undefined){balances.real=j.balance;saveAll();setAccount('real');document.getElementById('logs').innerHTML=`✅ REAL: ₹${j.balance.toFixed(2)}<br>`+document.getElementById('logs').innerHTML;}
}catch(e){}
}
function addHist(type,price,orderId){
tradeHistory.unshift({time:new Date().toLocaleString('en-IN'),mode:accountMode,type:type,price:price,orderId:orderId||''});
tradesCount[accountMode]=(tradesCount[accountMode]||0)+1;
saveAll();
setAccount(accountMode);
}
function renderHistory(){
let list = tradeHistory.filter(t=>t.mode==accountMode);
let h='';
list.forEach(t=>{
h+=`<div class="card rounded-xl p-3 flex justify-between items-center">
<div><p class="text-[11px] font-black ${t.type=='BUY'?'text-green-400':'text-red-400'}">${t.type} ${t.mode.toUpperCase()}</p><p class="text-[10px] text-zinc-300">₹${t.price}</p><p class="text-[8px] text-zinc-600">${t.orderId||''}</p></div>
<p class="text-[9px] text-zinc-500">${t.time}</p></div>`
});
document.getElementById('historyList').innerHTML=h||'<p class="text-center text-zinc-500 text-[12px] mt-10">No trades yet</p>';
}
function clearHistory(){
tradeHistory=tradeHistory.filter(t=>t.mode!=accountMode);
tradesCount[accountMode]=0;
saveAll();
renderHistory();
setAccount(accountMode);
}
async function manualTrade(type){
let price=candles[candles.length-1]?.close||0.0005125;
let priceStr = price>1? '₹'+Math.round(price) : '₹'+price.toFixed(7);
let orderId='';
document.getElementById('logs').innerHTML=`🚀 ${accountMode} ${type} ${priceStr}...<br>`+document.getElementById('logs').innerHTML;
if(accountMode=='real'){
try{
let ro=await fetch('/api/order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({side:type.toLowerCase()})});
let rj=await ro.json();
orderId=rj.orders?.[0]?.id || rj.id || JSON.stringify(rj).slice(0,30);
document.getElementById('logs').innerHTML=`✅ Order: ${orderId}<br>`+document.getElementById('logs').innerHTML;
setTimeout(connectReal,3000);
}catch(e){document.getElementById('logs').innerHTML=`❌ ${e.message}<br>`+document.getElementById('logs').innerHTML;}
}else{
orderId='demo-'+Date.now();
document.getElementById('logs').innerHTML=`✅ DEMO ${type} done<br>`+document.getElementById('logs').innerHTML;
}
addHist(type,priceStr,orderId);
renderHistory();
}
function setTF(d){
currentTF=d;
document.getElementById('tf1').className=d=='1'?'active-acc px-3 py-1 rounded-full text-[11px] font-bold':'px-3 py-1 rounded-full text-[11px] font-bold bg-[#1E1E2A] text-zinc-400';
document.getElementById('tf7').className=d=='7'?'active-acc px-3 py-1 rounded-full text-[11px] font-bold':'px-3 py-1 rounded-full text-[11px] font-bold bg-[#1E1E2A] text-zinc-400';
load();
}
async function load(){
try{
let r=await fetch(`/api/candles?interval=${currentTF=='1'?'15m':'1h'}`);
let d=await r.json();
if(!d || d.length==0) return;
d=d.reverse();
candles=d.map(c=>({time:Math.floor(c.time/1000),open:parseFloat(c.open),high:parseFloat(c.high),low:parseFloat(c.low),close:parseFloat(c.close)})).filter(c=>c.open>0 && c.close>0);
if(candles.length==0) return;
candleSeries.setData(candles);
chart.timeScale().fitContent();
let last=candles[candles.length-1].close;
let txt = last>1? '₹'+Math.round(last).toLocaleString('en-IN') : '₹'+last.toFixed(7);
document.getElementById('price').innerText=txt;
document.getElementById('balSub').innerHTML=`${accountMode} • ${txt}`;
}catch(e){console.log(e);}
}
setAccount(accountMode);
load();
setInterval(load,60000);
renderHistory();
document.getElementById('btn').onclick=()=>{
let s=document.getElementById('status'),b=document.getElementById('btn');
if(s.innerText==='STOP'){s.innerText='RUNNING';s.className='px-3 py-1.5 rounded-full text-[11px] font-black bg-green-500/15 text-green-400 border';b.innerText='STOP BOT ⏹️';b.className='w-full mt-3 py-4 rounded-2xl font-black bg-red-500';}
else{s.innerText='STOP';s.className='px-3 py-1.5 rounded-full text-[11px] font-black bg-red-500/15 text-red-400 border';b.innerText='START BOT 🚀';b.className='w-full mt-3 py-4 rounded-2xl font-black bg-violet-600';}
};
</script>
</body>
</html>
