<!DOCTYPE html><html><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><script src="https://cdn.tailwindcss.com"></script><title>History</title></head>
<body class="bg-[#0A0A0F] text-white p-5 max-w-[480px] mx-auto">
<a href="/" class="text-amber-400 font-bold text-[13px]">← Back</a>
<h1 class="font-black text-[22px] mt-4">Trade History</h1>
<p class="text-zinc-500 text-[12px] mt-1">PAXG GOLD • All Trades P&L</p>
<div id="list" class="mt-6 space-y-2"></div>
<script>
let trades=JSON.parse(localStorage.getItem('gold_trades')||'[]');
let total=trades.reduce((s,t)=>s+(t.pnl||0),0);
let html=`<div class="rounded-2xl bg-[#1A1A23] border border-[#232330] p-4 mb-4"><p class="text-[10px] tracking-widest text-zinc-500">TOTAL P&L</p><h2 class="text-[30px] font-black ${total>=0?'text-green-400':'text-red-400'}">${total>=0?'+':''}₹${total.toFixed(2)}</h2><p class="text-[11px] text-zinc-500">${trades.length} total trades</p></div>`;
if(trades.length===0) html+='<p class="text-zinc-600 text-center py-10">No history yet</p>';
trades.forEach(t=>{html+=`<div class="p-3 rounded-xl bg-[#12121A] border border-[#1E1E2A] flex justify-between"><div><p class="font-bold text-[12px] ${t.side==='buy'?'text-green-400':'text-red-400'}">${t.side.toUpperCase()} • ${t.qty.toFixed(6)} PAXG</p><p class="text-[10px] text-zinc-500">₹${t.price.toFixed(2)} • ${new Date(t.time).toLocaleString()}</p></div><div class="text-right"><p class="font-black text-[12px] ${t.pnl>=0?'text-green-400':'text-red-400'}">${t.pnl? (t.pnl>=0?'+₹'+t.pnl.toFixed(2):'-₹'+Math.abs(t.pnl).toFixed(2)) : '--'}</p></div></div>`});
document.getElementById('list').innerHTML=html;
</script>
</body></html>
